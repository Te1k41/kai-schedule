<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Zero to SOC Analyst — Roadmap</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#9E3A26">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kai Ops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared.css">
<style>
  h1 { font-family: var(--font-display); font-size: clamp(23px, 1.5vw, 33px); line-height: 1.2; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: clamp(13.5px, 0.8vw, 17px); line-height: 1.5; margin: 0 0 28px; }

  .layout { display: grid; grid-template-columns: 1fr minmax(220px, clamp(300px, 22vw, 440px)); gap: clamp(56px, 4.5vw, 110px); align-items: start; }
  .col-side { position: sticky; top: 24px; background: var(--paper-deep); border: 1px solid var(--border); border-radius: 2px; padding: 22px 24px; overflow: visible; }
  .col-main { min-width: 0; }

  .progress { display: flex; align-items: baseline; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .progress-pct { font-family: var(--font-display); font-size: clamp(44px, 3.4vw, 76px); font-weight: 600; color: var(--vermillion); line-height: 1; }
  .progress-meta { display: flex; flex-direction: column; gap: 6px; }
  .progress-count { font-size: clamp(13px, 0.75vw, 16px); color: var(--ink-soft); }
  .bar-track { height: 3px; width: 100%; background: var(--border); }
  .bar-fill { height: 100%; background: var(--vermillion); transition: width 0.4s ease; }
  @media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }

  .panel-label { font-size: clamp(12px, 0.65vw, 15px); font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 10px; }

  .up-next { padding-bottom: 0; }
  .up-next-meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; font-size: clamp(12.5px, 0.7vw, 15px); color: var(--ink-soft); }
  .ticket-id { font-family: var(--font-mono); color: var(--ink); }
  .up-next-task { font-family: var(--font-display); font-size: clamp(24px, 2vw, 34px); font-weight: 600; line-height: 1.15; margin: 0 0 18px; color: var(--vermillion); letter-spacing: -0.01em; }
  .celebrate { font-family: var(--font-display); font-size: clamp(20px, 1.6vw, 26px); line-height: 1.4; color: var(--ink); margin: 0; font-weight: 600; }

  details.phase { border-bottom: 1px solid var(--border); }
  details.phase summary { list-style: none; cursor: pointer; }
  details.phase summary::-webkit-details-marker { display: none; }
  .phase-header { display: flex; align-items: center; gap: 16px; padding: clamp(18px, 1.1vw, 24px) 10px; margin: 0 -10px; border-radius: 2px; transition: background-color 0.15s ease; }
  details.phase:hover .phase-header { background: rgba(33,30,26,0.035); }
  .phase-header:focus-visible { outline: 2px solid var(--vermillion); outline-offset: -2px; }
  .phase-num { font-family: var(--font-display); font-size: clamp(40px, 3vw, 64px); font-weight: 600; color: var(--phase-color, var(--ink-soft)); opacity: 0.5; line-height: 1; flex-shrink: 0; width: clamp(48px, 3.6vw, 76px); transition: opacity 0.15s ease; }
  .phase-num.current { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .phase-num { transition: none; } }
  .phase-text { flex: 1; min-width: 0; }
  .phase-title { font-size: clamp(16px, 0.95vw, 19px); font-weight: 700; }
  .phase-weeks { font-family: var(--font-mono); font-size: clamp(11.5px, 0.65vw, 14px); color: var(--ink-soft); display: block; margin-top: 2px; }
  .phase-header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .phase-count { font-family: var(--font-mono); font-size: clamp(12.5px, 0.7vw, 15px); color: var(--ink-soft); }
  .chevron { color: var(--ink-soft); font-size: 12px; transition: transform 0.15s ease; }
  details.phase[open] .chevron { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }

  .phase-note { font-size: clamp(13px, 0.75vw, 16px); color: var(--ink-soft); padding: 0 2px 16px calc(clamp(48px, 3.6vw, 76px) + 16px); margin: 0; }

  .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 10px 10px calc(clamp(48px, 3.6vw, 76px) + 16px); margin: 0 -10px; border-top: 1px solid var(--border); border-radius: 2px; transition: background-color 0.15s ease; }
  .task-row:hover { background: rgba(33,30,26,0.035); }
  .task-row:has(input:checked) { animation: check-flash 0.5s ease; }
  @keyframes check-flash { from { background: rgba(188,65,48,0.1); } to { background: transparent; } }

  .task-row input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 19px; height: 19px; margin-top: 2px;
    border: 1.5px solid var(--ink-soft); border-radius: 2px; background: transparent; cursor: pointer; position: relative;
    display: inline-flex; align-items: center; justify-content: center; transition: border-color 0.15s ease, background-color 0.15s ease;
  }
  .task-row input[type="checkbox"]:hover { border-color: var(--vermillion); }
  .task-row input[type="checkbox"]:checked { background: var(--vermillion); border-color: var(--vermillion); animation: check-pop 0.22s ease; }
  .task-row input[type="checkbox"]:checked::after { content: '了'; color: var(--paper); font-size: 12px; font-family: var(--font-display); line-height: 1; }
  @keyframes check-pop { 50% { transform: scale(1.3); } }
  .task-row input[type="checkbox"]:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 2px; }

  .task-body { flex: 1; min-width: 0; }
  .task-label { display: block; cursor: pointer; font-size: clamp(14.5px, 0.8vw, 17px); line-height: 1.5; transition: color 0.15s ease; }
  .task-row:hover .task-label { color: var(--vermillion); }
  .task-label.checked { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--border); }

  .task-detail { margin-top: 6px; }
  .task-detail summary { list-style: none; cursor: pointer; font-size: clamp(13px, 0.7vw, 15.5px); color: var(--vermillion); font-weight: 700; }
  .task-detail summary::-webkit-details-marker { display: none; }
  .task-detail summary::before { content: '+ Details'; }
  .task-detail[open] summary::before { content: '– Details'; }
  .task-detail .detail-body { line-height: 1.75; font-size: clamp(15px, 0.9vw, 17.5px); color: var(--ink); margin: 8px 0 4px; padding: 12px 14px; border-left: 3px solid var(--vermillion); background: var(--paper-deep); }
  .task-detail .detail-body .detail-para { margin: 0 0 14px; }
  .task-detail .detail-body .detail-para:last-child { margin-bottom: 0; }
  .task-detail .detail-body strong { color: var(--vermillion); font-weight: 700; }

  .footer { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; font-size: clamp(12.5px, 0.7vw, 15px); color: var(--ink-soft); flex-wrap: wrap; gap: 8px; }
  .footer button { background: none; border: none; color: var(--ink-soft); font-size: clamp(12.5px, 0.7vw, 15px); text-decoration: underline; cursor: pointer; font-family: var(--font); padding: 4px; }
  .footer button:hover { color: var(--ink); }
  .footer [data-action="reset-confirm"] { color: var(--danger); font-weight: 700; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; gap: 20px; }
    .col-side { position: static; order: -1; }
  }

  @media (max-width: 420px) {
    .phase-num { font-size: 30px; width: 36px; }
    .phase-note { padding-left: 48px; }
    .task-row { padding-left: 48px; }
  }
</style>
</head>
<body>
  <div class="koi-bg" aria-hidden="true"></div>

  <nav class="top"><a href="./index.html">Home</a><a href="./schedule.html">Schedule</a><a href="./roadmap.html" class="current">Roadmap</a><a href="./health.html">Health</a><a href="./finance.html">Finance</a></nav>

  <p class="eyebrow" id="boot-loading" style="text-align:center; margin-top:60px;">Loading…</p>

  <div class="auth-gate" id="auth-gate" style="display:none;">
    <p class="eyebrow">Sign in</p>
    <h1>One tap to sync</h1>
    <p class="subtitle">Sign in with the same Google account on every device and this stays in sync automatically.</p>
    <button class="btn" id="signin-btn">Sign in with Google</button>
    <p class="auth-error" id="auth-error" style="display:none;"></p>
  </div>

  <p class="signed-in-as" id="signed-in-as" style="display:none;"></p>
  <div class="shell" id="app" style="display:none;">
    <p class="eyebrow">Loading…</p>
  </div>

<script type="module">
import { loadData, saveData } from "./firebase-init.js";
import { escapeHtml, formatDetail, initAuthUI, notifySaveFailed } from "./app-shell.js";

const PHASES = [
  {
    id: "p1", title: "Foundations", weeks: "Weeks 1-3",
    note: "Networking and Linux basics - nothing else clicks without them.",
    tasks: [
      { id: "p1-1", label: "Create a free TryHackMe account", detail: "Go to tryhackme.com and sign up free.\n\nDone when: you can log in and see your dashboard." },
      { id: "p1-2", label: "Finish Pre Security: Network Fundamentals", detail: "Covers IP addressing, subnetting basics, and the OSI/TCP-IP model — the vocabulary every other module assumes you already know.\n\nDone when: the module shows 100% and you could explain what a subnet mask does to someone else." },
      { id: "p1-3", label: "Finish Pre Security: How the Web Works", detail: "HTTP requests/responses, DNS, and client-server basics.\n\nDone when: you can trace what happens between typing a URL and a page loading, step by step." },
      { id: "p1-4", label: "Finish Pre Security: Linux Fundamentals (Parts 1-3)", detail: "Command line basics, file permissions, navigating a Linux filesystem.\n\nDone when: you're comfortable in a terminal without looking up every command." },
      { id: "p1-5", label: "Finish Pre Security: Windows Fundamentals", detail: "Windows OS basics, the registry, Event Viewer, user accounts — the Windows-side counterpart to the Linux module.\n\nDone when: you know where to find basic system and security logs on Windows." },
      { id: "p1-6", label: "Complete the full Pre Security path badge", detail: "All modules above, plus any remaining ones in the path.\n\nDone when: TryHackMe shows the path at 100% and awards the badge." }
    ]
  },
  {
    id: "p2", title: "Security+", weeks: "Weeks 3-11",
    note: "The one cert that gets you past CV filters.",
    tasks: [
      { id: "p2-1", label: "Save Professor Messer's free SY0-701 course", detail: "Find it at professormesser.com — free, no signup needed. Bookmark the full playlist.\n\nThis is your primary study track for the rest of this phase." },
      { id: "p2-2", label: "Study Domain 1: General Security Concepts", detail: "Security controls, the CIA triad, zero trust, and foundational vocabulary.\n\nDone when: you've watched every Domain 1 video and have your own written notes." },
      { id: "p2-3", label: "Study Domain 2: Threats, Vulnerabilities & Mitigations", detail: "Malware types, attack techniques, and how to mitigate them — the biggest domain by exam weight.\n\nDone when: notes are complete and you can name 5 mitigation techniques from memory." },
      { id: "p2-4", label: "Study Domain 3: Security Architecture", detail: "Network and system architecture, cloud concepts, secure design.\n\nDone when: your notes cover every video in this domain." },
      { id: "p2-5", label: "Study Domain 4: Security Operations", detail: "Incident response, monitoring, and day-to-day SOC-relevant material — the most directly useful domain for the actual job.\n\nDone when: notes are complete." },
      { id: "p2-6", label: "Study Domain 5: Security Program Management", detail: "Governance, risk management, and compliance — the most 'management' domain.\n\nDone when: notes are complete, even if it's the least interesting one." },
      { id: "p2-7", label: "Start daily practice questions", detail: "A short daily habit, not a one-time task — this one is meant to stay 'in progress' for a while.\n\nDone when: it's a habit you've kept for at least a week straight." },
      { id: "p2-8", label: "Score 85%+ on two full practice exams in a row", detail: "Take full-length, timed practice exams — not just topic quizzes.\n\nDone when: you hit 85%+ twice back to back, not just once." },
      { id: "p2-9", label: "Book the exam voucher", detail: "~$425, bought directly through CompTIA or an authorized reseller.\n\nDone when: you have a confirmed exam date on the calendar." },
      { id: "p2-10", label: "Sit the Security+ exam", detail: "Done when: you've taken it — pass or fail, this task closes either way.\n\nIf you don't pass, the retake is a new task, not a redo of this one." }
    ]
  },
  {
    id: "p3", title: "SOC Hands-On", weeks: "Weeks 6-16, alongside Security+",
    note: "This is where you actually learn the job.",
    tasks: [
      { id: "p3-1", label: "Start TryHackMe's SOC Level 1 path", detail: "A dedicated path built around real SOC tools — Splunk, Wireshark, SIEM alert triage.\n\nDone when: you've started at least the first room." },
      { id: "p3-2", label: "Create a free LetsDefend account", detail: "Sign up at letsdefend.io.\n\nThis is where you'll practice real alert triage against a live-feeling SIEM." },
      { id: "p3-3", label: "Complete 5 LetsDefend alert-triage scenarios", detail: "Pick 5 alerts from the queue and investigate each to a verdict — true positive or false positive.\n\nDone when: you've closed 5, with your own notes on each." },
      { id: "p3-4", label: "Finish Splunk Fundamentals 1 (free)", detail: "Splunk's own free intro course — search basics, SPL fundamentals.\n\nMost SOC tooling assumes this baseline, so it's worth doing properly, not skimming." },
      { id: "p3-5", label: "Learn the top 10 MITRE ATT&CK techniques", detail: "Pick the 10 most common techniques (phishing, credential dumping, PowerShell abuse, etc.) and learn what each looks like in logs.\n\nDone when: you can name the technique from a log snippet, not just recite the list." },
      { id: "p3-6", label: "Finish TryHackMe SOC Level 1 path", detail: "All rooms in the path complete.\n\nThis is the core hands-on credential for this phase." },
      { id: "p3-7", label: "Complete 10 more LetsDefend scenarios", detail: "10 more beyond the first 5 — 15 total.\n\nBy now you should be faster and more confident per scenario. Notice that, it's real progress." }
    ]
  },
  {
    id: "p4", title: "Portfolio", weeks: "Weeks 14-18",
    note: "This gets you noticed more than the cert alone.",
    tasks: [
      { id: "p4-1", label: "Set up GitHub with a simple portfolio README", detail: "One repo, one README — your name, what you're working toward, and links to your write-ups as you publish them.\n\nDone when: it's live and public." },
      { id: "p4-2", label: "Publish write-ups for investigations 1-5", detail: "Turn 5 of your LetsDefend/TryHackMe investigations into short write-ups: what the alert was, what you found, what you'd do next.\n\nDone when: 5 are published." },
      { id: "p4-3", label: "Publish write-ups for investigations 6-10", detail: "5 more write-ups, same format as the first batch.\n\nDone when: 10 total are published." },
      { id: "p4-4", label: "Publish write-ups for investigations 11-15", detail: "5 more write-ups.\n\nDone when: 15 total are published — a solid portfolio, not just a couple of samples." },
      { id: "p4-5", label: "Update LinkedIn with certs and progress", detail: "Add Security+ (once passed), your GitHub portfolio link, and a headline that says what you're targeting.\n\nDone when: a recruiter skimming your profile for 10 seconds understands what you want." },
      { id: "p4-6", label: "Rewrite CV around Security+, labs, Python background", detail: "Lead with the cert and hands-on lab hours, not your current job title.\n\nFrame your logistics/Python background as a transferable edge, not a detour — it's worth a line, not an apology." }
    ]
  },
  {
    id: "p5", title: "Apply", weeks: "Month 4 onward",
    note: "Tier 1 SOC Analyst and Junior Security Analyst roles.",
    tasks: [
      { id: "p5-1", label: "List 15-20 target companies", detail: "Mix of company sizes. Include the PwC/EY/Bosch/Noventiq-style firms already known to hire entry-level SOC roles in VN, plus a few others you find.\n\nDone when: the list exists somewhere you'll actually revisit." },
      { id: "p5-2", label: "Send first 5 applications", detail: "Tailor each one minimally — right job title, right company name in the cover letter, nothing more elaborate needed yet.\n\nDone when: 5 are sent." },
      { id: "p5-3", label: "Prep answers for common SOC interview questions", detail: "Have a real answer ready for: 'walk me through how you'd triage this alert,' 'what's the CIA triad,' and 'tell me about a lab you did.'\n\nDone when: you could answer these out loud without freezing." },
      { id: "p5-4", label: "Send 5 more applications", detail: "10 total sent by now.\n\nDone when: 5 more are out the door." },
      { id: "p5-5", label: "Keep applying weekly and follow up", detail: "An ongoing habit, not a one-time task.\n\nDone when: it's a routine you've sustained for a few weeks straight." },
      { id: "p5-6", label: "Update CV/portfolio from interview feedback", detail: "Every interview teaches you something about a gap — fix it in the CV/portfolio before the next one, don't wait until you have 'enough' feedback." }
    ]
  }
];

const STORAGE_KEY = "soc-roadmap-progress";
let progress = {};
let openPhases = new Set();
let loaded = false;
let resetArmed = false;

function flatTasks() {
  return PHASES.flatMap(p => p.tasks.map(t => ({ ...t, phaseId: p.id, phaseTitle: p.title, phaseWeeks: p.weeks })));
}
function totalCount() { return flatTasks().length; }
function doneCount() { return flatTasks().filter(t => progress[t.id]).length; }
function nextTask() { return flatTasks().find(t => !progress[t.id]) || null; }

async function loadProgress() {
  try {
    const value = await loadData(STORAGE_KEY);
    if (value) progress = value;
  } catch (e) {
    progress = {};
  }
  loaded = true;
  const nt = nextTask();
  if (nt) openPhases.add(nt.phaseId);
  render();
}

async function saveProgress() {
  const ok = await saveData(STORAGE_KEY, progress);
  if (!ok) notifySaveFailed();
}

function toggleTask(id) {
  progress[id] = !progress[id];
  saveProgress();
  const nt = nextTask();
  if (nt) openPhases.add(nt.phaseId);
  render();
}

function armReset() {
  resetArmed = true;
  render();
}

function cancelReset() {
  resetArmed = false;
  render();
}

async function confirmReset() {
  resetArmed = false;
  progress = {};
  await saveProgress();
  openPhases = new Set([PHASES[0].id]);
  render();
}

function render() {
  const app = document.getElementById("app");
  if (!loaded) { app.innerHTML = '<p class="eyebrow">Loading…</p>'; return; }

  const total = totalCount();
  const done = doneCount();
  const pct = total ? Math.round((done / total) * 100) : 0;
  const nt = nextTask();

  const upNextHtml = nt ? `
    <p class="panel-label">Up next</p>
    <div class="up-next">
      <div class="up-next-meta">
        <span class="ticket-id">${nt.id.toUpperCase()}</span>
        <span>${escapeHtml(nt.phaseTitle)} &middot; ${escapeHtml(nt.phaseWeeks)}</span>
      </div>
      <p class="up-next-task">${escapeHtml(nt.label)}</p>
      <button class="btn" data-action="complete-next" data-id="${nt.id}">Mark done</button>
    </div>
  ` : `
    <p class="panel-label">Status</p>
    <div class="up-next">
      <p class="celebrate">Every task is checked off. Sit the exam if you have not yet, and get those applications out — you are job-ready.</p>
    </div>
  `;

  const phasesHtml = PHASES.map((phase, i) => {
    const pDone = phase.tasks.filter(t => progress[t.id]).length;
    const isOpen = openPhases.has(phase.id);
    const isCurrentPhase = nt && nt.phaseId === phase.id;
    const tasksHtml = phase.tasks.map(t => {
      const checked = !!progress[t.id];
      const id = `chk-${t.id}`;
      const detailHtml = t.detail ? `
        <details class="task-detail">
          <summary></summary>
          <div class="detail-body">${formatDetail(t.detail)}</div>
        </details>
      ` : "";
      return `
        <div class="task-row">
          <input type="checkbox" id="${id}" data-action="toggle-task" data-id="${t.id}" ${checked ? "checked" : ""} />
          <div class="task-body">
            <label for="${id}" class="task-label${checked ? " checked" : ""}">${escapeHtml(t.label)}</label>
            ${detailHtml}
          </div>
        </div>
      `;
    }).join("");

    return `
      <details class="phase" data-action="phase" data-id="${phase.id}" ${isOpen ? "open" : ""}>
        <summary>
          <div class="phase-header">
            <span class="phase-num${isCurrentPhase ? " current" : ""}" style="--phase-color:var(--phase${i + 1})">${String(i + 1).padStart(2, "0")}</span>
            <span class="phase-text">
              <span class="phase-title">${escapeHtml(phase.title)}</span>
              <span class="phase-weeks">${escapeHtml(phase.weeks)}</span>
            </span>
            <span class="phase-header-right">
              <span class="phase-count">${pDone}/${phase.tasks.length}</span>
              <span class="chevron">▾</span>
            </span>
          </div>
        </summary>
        <p class="phase-note">${escapeHtml(phase.note)}</p>
        ${tasksHtml}
      </details>
    `;
  }).join("");

  app.innerHTML = `
    <p class="eyebrow">Roadmap</p>
    <h1>Zero to SOC Analyst</h1>
    <p class="subtitle">Your step-by-step path into a Tier 1 SOC role. One task at a time - check it off, and the next one lights up.</p>

    <div class="layout">
      <div class="col-main">
        ${phasesHtml}
        <div class="footer">
          <span>Saved automatically</span>
          ${resetArmed ? `
            <span>
              Clear everything?
              <button data-action="reset-confirm" type="button">Yes, clear</button>
              <button data-action="reset-cancel" type="button">Cancel</button>
            </span>
          ` : `<button data-action="reset" type="button">Reset progress</button>`}
        </div>
      </div>
      <div class="col-side">
        <div class="progress">
          <span class="progress-pct">${pct}%</span>
          <span class="progress-meta">
            <span class="progress-count">${done} of ${total} tasks complete</span>
            <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
          </span>
        </div>
        ${upNextHtml}
      </div>
    </div>
  `;

  app.querySelectorAll('[data-action="toggle-task"]').forEach(el => {
    el.addEventListener("change", () => toggleTask(el.getAttribute("data-id")));
  });
  app.querySelectorAll('details[data-action="phase"]').forEach(el => {
    el.addEventListener("toggle", () => {
      const id = el.getAttribute("data-id");
      if (el.open) openPhases.add(id); else openPhases.delete(id);
    });
  });
  const completeBtn = app.querySelector('[data-action="complete-next"]');
  if (completeBtn) {
    completeBtn.addEventListener("click", () => toggleTask(completeBtn.getAttribute("data-id")));
  }
  const resetBtn = app.querySelector('[data-action="reset"]');
  if (resetBtn) resetBtn.addEventListener("click", armReset);
  const resetConfirmBtn = app.querySelector('[data-action="reset-confirm"]');
  if (resetConfirmBtn) resetConfirmBtn.addEventListener("click", confirmReset);
  const resetCancelBtn = app.querySelector('[data-action="reset-cancel"]');
  if (resetCancelBtn) resetCancelBtn.addEventListener("click", cancelReset);
}

initAuthUI({
  onSignedIn: () => { if (!loaded) loadProgress(); },
  onSignedOut: () => { loaded = false; }
});
</script>
<script src="./pwa-init.js"></script>
</body>
</html>
