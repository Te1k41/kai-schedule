<style>
  h1 { font-family: var(--font-display); font-size: clamp(23px, 1.5vw, 33px); line-height: 1.2; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: clamp(13.5px, 0.8vw, 17px); line-height: 1.5; margin: 0 0 28px; }

  .resource-box { background: var(--paper-deep); border: 1px solid var(--border); border-radius: 2px; padding: 18px 22px; margin-bottom: 28px; }
  .resource-box summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .resource-box summary::-webkit-details-marker { display: none; }
  .resource-box[open] .chevron { transform: rotate(180deg); }
  .resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 16px; }
  .resource-group-title { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--vermillion); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 8px; }
  .resource-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 6px 0; border-top: 1px solid var(--border); }
  .resource-row:first-of-type { border-top: none; }
  .resource-row a { color: var(--ink); font-weight: 700; font-size: var(--fs-xs); text-decoration: none; border-bottom: 1px solid var(--border); }
  .resource-row a:hover { color: var(--vermillion); border-color: var(--vermillion); }
  .resource-cost { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--ink-soft); }
  .resource-note { flex-basis: 100%; font-size: var(--fs-2xs); color: var(--ink-soft); }

  .layout { display: grid; grid-template-columns: 1fr minmax(220px, clamp(300px, 22vw, 440px)); gap: clamp(56px, 4.5vw, 110px); align-items: start; }
  .col-side { position: sticky; top: 24px; background: var(--paper-deep); border: 1px solid var(--border); border-radius: 2px; padding: 22px 24px; overflow: visible; }
  .notes-box { width: 100%; min-height: 120px; resize: vertical; font-family: var(--font); font-size: var(--fs-xs); color: var(--ink); background: var(--paper); border: 1px solid var(--border); border-radius: 2px; padding: 10px 12px; line-height: 1.5; }
  .notes-box:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 1px; }
  .col-main { min-width: 0; }

  .progress { display: flex; align-items: baseline; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .progress-pct { font-family: var(--font-display); font-size: clamp(44px, 3.4vw, 76px); font-weight: 600; color: var(--vermillion); line-height: 1; }
  .progress-meta { display: flex; flex-direction: column; gap: 6px; }
  .progress-count { font-size: clamp(13px, 0.75vw, 16px); color: var(--ink-soft); }
  .bar-track { height: 3px; width: 100%; background: var(--border); }
  .bar-fill { height: 100%; background: var(--vermillion); transition: width 0.4s ease; }
  @media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }

  .panel-label { font-size: clamp(12px, 0.65vw, 15px); font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 10px; }

  .up-next { padding-bottom: 0; }
  .up-next-meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; font-size: clamp(12.5px, 0.7vw, 15px); color: var(--ink-soft); }
  .ticket-id { font-family: var(--font-mono); color: var(--ink); }
  .up-next-task { font-family: var(--font-display); font-size: clamp(24px, 2vw, 34px); font-weight: 600; line-height: 1.15; margin: 0 0 18px; color: var(--vermillion); letter-spacing: -0.01em; }
  .celebrate { font-family: var(--font-display); font-size: clamp(20px, 1.6vw, 26px); line-height: 1.4; color: var(--ink); margin: 0; font-weight: 600; }

  details.phase { border-bottom: 1px solid var(--border); }
  details.phase summary { list-style: none; cursor: pointer; }
  details.phase summary::-webkit-details-marker { display: none; }
  .phase-header { display: flex; align-items: center; gap: 16px; padding: clamp(18px, 1.1vw, 24px) 10px; margin: 0 -10px; border-radius: 2px; transition: background-color 0.15s ease; }
  details.phase:hover .phase-header { background: rgba(33,30,26,0.035); }
  .phase-header:focus-visible { outline: 2px solid var(--vermillion); outline-offset: -2px; }
  .phase-num { font-family: var(--font-display); font-size: clamp(40px, 3vw, 64px); font-weight: 600; color: var(--phase-color, var(--ink-soft)); opacity: 0.5; line-height: 1; flex-shrink: 0; width: clamp(48px, 3.6vw, 76px); transition: opacity 0.15s ease; }
  .phase-num.current { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .phase-num { transition: none; } }
  .phase-text { flex: 1; min-width: 0; }
  .phase-title { font-size: clamp(16px, 0.95vw, 19px); font-weight: 700; }
  .phase-weeks { font-family: var(--font-mono); font-size: clamp(11.5px, 0.65vw, 14px); color: var(--ink-soft); display: block; margin-top: 2px; }
  .phase-header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .phase-count { font-family: var(--font-mono); font-size: clamp(12.5px, 0.7vw, 15px); color: var(--ink-soft); }
  .chevron { color: var(--ink-soft); font-size: 12px; transition: transform 0.15s ease; }
  details.phase[open] .chevron { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }

  .phase-note { font-size: clamp(13px, 0.75vw, 16px); color: var(--ink-soft); padding: 0 2px 16px calc(clamp(48px, 3.6vw, 76px) + 16px); margin: 0; }

  .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 10px 10px calc(clamp(48px, 3.6vw, 76px) + 16px); margin: 0 -10px; border-top: 1px solid var(--border); border-radius: 2px; transition: background-color 0.15s ease; }
  .task-row:hover { background: rgba(33,30,26,0.035); }
  .task-row:has(input:checked) { animation: check-flash 0.5s ease; }
  @keyframes check-flash { from { background: rgba(188,65,48,0.1); } to { background: transparent; } }

  .task-row input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 19px; height: 19px; margin-top: 2px;
    border: 1.5px solid var(--ink-soft); border-radius: 2px; background: transparent; cursor: pointer; position: relative;
    display: inline-flex; align-items: center; justify-content: center; transition: border-color 0.15s ease, background-color 0.15s ease;
  }
  .task-row input[type="checkbox"]:hover { border-color: var(--vermillion); }
  .task-row input[type="checkbox"]:checked { background: var(--vermillion); border-color: var(--vermillion); animation: check-pop 0.22s ease; }
  .task-row input[type="checkbox"]:checked::after { content: '了'; color: var(--paper); font-size: 12px; font-family: var(--font-display); line-height: 1; }
  @keyframes check-pop { 50% { transform: scale(1.3); } }
  .task-row input[type="checkbox"]:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 2px; }

  .task-body { flex: 1; min-width: 0; }
  .task-label { display: block; cursor: pointer; font-size: clamp(14.5px, 0.8vw, 17px); line-height: 1.5; transition: color 0.15s ease; }
  .task-row:hover .task-label { color: var(--vermillion); }
  .task-label.checked { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--border); }

  .task-detail { margin-top: 6px; }
  .task-detail summary { list-style: none; cursor: pointer; font-size: clamp(13px, 0.7vw, 15.5px); color: var(--vermillion); font-weight: 700; }
  .task-detail summary::-webkit-details-marker { display: none; }
  .task-detail summary::before { content: '+ Details'; }
  .task-detail[open] summary::before { content: '– Details'; }
  .task-detail .detail-body { line-height: 1.75; font-size: clamp(15px, 0.9vw, 17.5px); color: var(--ink); margin: 8px 0 4px; padding: 12px 14px; border-left: 3px solid var(--vermillion); background: var(--paper-deep); }
  .task-detail .detail-body .detail-para { margin: 0 0 14px; }
  .task-detail .detail-body .detail-para:last-child { margin-bottom: 0; }
  .task-detail .detail-body strong { color: var(--vermillion); font-weight: 700; }

  .footer { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; font-size: clamp(12.5px, 0.7vw, 15px); color: var(--ink-soft); flex-wrap: wrap; gap: 8px; }
  .footer button { background: none; border: none; color: var(--ink-soft); font-size: clamp(12.5px, 0.7vw, 15px); text-decoration: underline; cursor: pointer; font-family: var(--font); padding: 4px; }
  .footer button:hover { color: var(--ink); }
  .footer [data-action="reset-confirm"] { color: var(--danger); font-weight: 700; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; gap: 20px; }
    .col-side { position: static; order: -1; }
  }

  @media (max-width: 420px) {
    .phase-num { font-size: 30px; width: 36px; }
    .phase-note { padding-left: 48px; }
    .task-row { padding-left: 48px; }
  }

  .edit-toggle-row { margin: -18px 0 20px; }
  .task-edit-controls { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; align-self: flex-start; }
  .phase-edit-controls { display: flex; gap: 6px; }
  .task-edit-row { align-items: stretch; }
  .phase-edit-form { padding: 0 2px 16px calc(clamp(48px, 3.6vw, 76px) + 16px); }
  .row-del { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; }
  .row-del:hover { color: var(--danger); }

  .log-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .log-field { display: flex; flex-direction: column; gap: 5px; }
  .log-field.wide { grid-column: 1 / -1; }
  .log-field label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .log-field input, .log-field textarea {
    font-family: var(--font); font-size: var(--fs-base); color: var(--ink); background: var(--paper);
    border: 1px solid var(--border); border-radius: 2px; padding: 9px 10px; width: 100%; resize: vertical;
  }
  .log-field input:focus-visible, .log-field textarea:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 1px; }
  .log-save-row { display: flex; align-items: center; gap: 14px; }

  .edit-fab { position: fixed; right: 20px; bottom: 20px; z-index: 50; }
  .edit-fab .btn { box-shadow: 0 4px 16px rgba(33,30,26,0.25); }
</style>
</head>

  <div class="auth-gate" id="auth-gate" style="display:none;">
    <p class="eyebrow">Sign in</p>
    <h1>One tap to sync</h1>
    <p class="subtitle">Sign in with the same Google account on every device and this stays in sync automatically.</p>
    <button class="btn" id="signin-btn">Sign in with Google</button>
    <p class="auth-error" id="auth-error" style="display:none;"></p>

  <p class="signed-in-as" id="signed-in-as" style="display:none;"></p>

<script type="module">
import { loadData, saveData } from "./firebase-init.js";
import { escapeHtml, formatDetail, initAuthUI, notifySaveFailed, uid } from "./app-shell.js";

const DEFAULT_PHASES = [
  {
    id: "p1", title: "Foundations", weeks: "Weeks 1-3",
    note: "Networking and Linux basics - nothing else clicks without them.",
    tasks: [
      { id: "p1-1", label: "Create a free TryHackMe account", detail: "Go to tryhackme.com and sign up free.\n\nDone when: you can log in and see your dashboard." },
      { id: "p1-2", label: "Finish Pre Security: Network Fundamentals", detail: "Covers IP addressing, subnetting basics, and the OSI/TCP-IP model — the vocabulary every other module assumes you already know.\n\nDone when: the module shows 100% and you could explain what a subnet mask does to someone else." },
      { id: "p1-3", label: "Finish Pre Security: How the Web Works", detail: "HTTP requests/responses, DNS, and client-server basics.\n\nDone when: you can trace what happens between typing a URL and a page loading, step by step." },
      { id: "p1-4", label: "Finish Pre Security: Linux Fundamentals (Parts 1-3)", detail: "Command line basics, file permissions, navigating a Linux filesystem.\n\nDone when: you're comfortable in a terminal without looking up every command." },
      { id: "p1-5", label: "Finish Pre Security: Windows Fundamentals", detail: "Windows OS basics, the registry, Event Viewer, user accounts — the Windows-side counterpart to the Linux module.\n\nDone when: you know where to find basic system and security logs on Windows." },
      { id: "p1-6", label: "Complete the full Pre Security path badge", detail: "All modules above, plus any remaining ones in the path.\n\nDone when: TryHackMe shows the path at 100% and awards the badge." },
      { id: "p1-7", label: "Optional: OverTheWire Bandit for extra Linux reps", detail: "Free, no signup needed beyond SSH: overthewire.org/wargames/bandit — 34 levels of pure command-line drilling.\n\nGood to run alongside Pre Security, or while waiting on money for TryHackMe Premium later." },
      { id: "p1-8", label: "Optional: picoCTF for beginner CTF practice", detail: "Free, always-open archive: picoctf.org.\n\nGood once Bandit starts feeling easy — first taste of CTF-style problem solving." }
    ]
  },
  {
    id: "p2", title: "Security+", weeks: "Weeks 3-11",
    note: "The one cert that gets you past CV filters.",
    tasks: [
      { id: "p2-1", label: "Save Professor Messer's free SY0-701 course", detail: "professormesser.com/security-plus/sy0-701 — free, no signup needed. Bookmark the full playlist plus his free pop quizzes on the same site.\n\nThis is your primary study track for the rest of this phase." },
      { id: "p2-2", label: "Study Domain 1: General Security Concepts", detail: "Security controls, the CIA triad, zero trust, and foundational vocabulary.\n\nDone when: you've watched every Domain 1 video and have your own written notes." },
      { id: "p2-3", label: "Study Domain 2: Threats, Vulnerabilities & Mitigations", detail: "Malware types, attack techniques, and how to mitigate them — the biggest domain by exam weight.\n\nDone when: notes are complete and you can name 5 mitigation techniques from memory." },
      { id: "p2-4", label: "Study Domain 3: Security Architecture", detail: "Network and system architecture, cloud concepts, secure design.\n\nDone when: your notes cover every video in this domain." },
      { id: "p2-5", label: "Study Domain 4: Security Operations", detail: "Incident response, monitoring, and day-to-day SOC-relevant material — the most directly useful domain for the actual job.\n\nDone when: notes are complete." },
      { id: "p2-6", label: "Study Domain 5: Security Program Management", detail: "Governance, risk management, and compliance — the most 'management' domain.\n\nDone when: notes are complete, even if it's the least interesting one." },
      { id: "p2-7", label: "Start daily practice questions", detail: "Professor Messer's pop quizzes (free, same site) work for this. A short daily habit, not a one-time task — this one is meant to stay 'in progress' for a while.\n\nDone when: it's a habit you've kept for at least a week straight." },
      { id: "p2-8", label: "Score 85%+ on two full practice exams in a row", detail: "Take full-length, timed practice exams — not just topic quizzes. If free pop quizzes stop cutting it, Messer sells a practice-exam bundle, but try free first.\n\nDone when: you hit 85%+ twice back to back, not just once." },
      { id: "p2-9", label: "Book the exam voucher", detail: "$439 direct from CompTIA (comptia.org). Cheaper via authorized resellers: Professor Messer ~$395, Training Camp ~$373. This is the one purchase in the whole roadmap you actually can't skip.\n\nDone when: you have a confirmed exam date on the calendar." },
      { id: "p2-10", label: "Sit the Security+ exam", detail: "Done when: you've taken it — pass or fail, this task closes either way.\n\nIf you don't pass, the retake is a new task, not a redo of this one." }
    ]
  },
  {
    id: "p3", title: "SOC Hands-On", weeks: "Weeks 6-16, alongside Security+",
    note: "This is where you actually learn the job.",
    tasks: [
      { id: "p3-1", label: "Start TryHackMe's SOC Level 1 path", detail: "A dedicated path built around real SOC tools — Splunk, Wireshark, SIEM alert triage. tryhackme.com/path/outline/soclevel1\n\nMost of this path needs TryHackMe Premium (~$8-14/mo, cheaper on an annual plan) — free rooms mostly ran out back in Foundations.\n\nDone when: you've started at least the first room." },
      { id: "p3-2", label: "Create a free LetsDefend account", detail: "Sign up at letsdefend.io — free tier gives 15 alert investigations/month, plenty to start.\n\nThis is where you'll practice real alert triage against a live-feeling SIEM." },
      { id: "p3-3", label: "Complete 5 LetsDefend alert-triage scenarios", detail: "Pick 5 alerts from the queue and investigate each to a verdict — true positive or false positive.\n\nDone when: you've closed 5, with your own notes on each." },
      { id: "p3-4", label: "Finish Splunk Fundamentals 1 (free)", detail: "splunk.com/en_us/training/free-courses — start with the free 'Intro to Splunk' pair before Fundamentals 1 itself. Search basics, SPL fundamentals.\n\nMost SOC tooling assumes this baseline, so it's worth doing properly, not skimming." },
      { id: "p3-5", label: "Learn the top 10 MITRE ATT&CK techniques", detail: "attack.mitre.org — free reference, not a course. Pick the 10 most common techniques (phishing, credential dumping, PowerShell abuse, etc.) and learn what each looks like in logs.\n\nDone when: you can name the technique from a log snippet, not just recite the list." },
      { id: "p3-6", label: "Finish TryHackMe SOC Level 1 path", detail: "All rooms in the path complete.\n\nThis is the core hands-on credential for this phase." },
      { id: "p3-7", label: "Complete 10 more LetsDefend scenarios", detail: "10 more beyond the first 5 — 15 total.\n\nBy now you should be faster and more confident per scenario. Notice that, it's real progress." },
      { id: "p3-8", label: "Optional: Blue Team Labs Online (BTLO) for extra investigations", detail: "blueteamlabs.online — free tier gives 15 labs and 10 hrs/month lab time. Good second source of investigations alongside LetsDefend, different scenarios to write up for the portfolio phase." },
      { id: "p3-9", label: "Learn the OWASP Top 10", detail: "owasp.org/www-project-top-ten — free. Pulled straight from a live VNPT-IT security engineer posting's own list of attack types (alongside DDoS, Malware, Phishing) — this isn't generic, it's literally what VN employers list.\n\nDone when: you can name all 10 and explain one exploit example for each." },
      { id: "p3-10", label: "Get hands-on with Nmap", detail: "TryHackMe's Nmap room — free/mostly free. Vulnerability-scanning tool named in real VN SOC/security-engineer postings alongside Nessus and Nexpose (those two are paid enterprise tools, not worth a home task — Nmap is the free one that matters).\n\nDone when: you can run and explain a basic scan without looking up every flag." },
      { id: "p3-11", label: "Learn firewall / IDS-IPS / VPN basics", detail: "TryHackMe network security content covers this. Matches a real VNPT/Viettel JD requirement almost word for word: NextGen firewalls, IPS/IDS, VPN, WAF.\n\nDone when: you can explain what each of those four does and why a SOC analyst needs to read their logs." },
      { id: "p3-12", label: "Try the ELK stack alongside Splunk", detail: "elastic.co/training — free. VN job postings name Splunk, ELK, and QRadar in the same breath as 'the SIEM' — Splunk's paid, QRadar's enterprise-only, but ELK is free and what smaller VN shops actually run day to day.\n\nDone when: you've run a basic search/dashboard in ELK, same as you did in Splunk." },
      { id: "p3-13", label: "Optional: Intro to Malware Analysis", detail: "TryHackMe's Intro to Malware Analysis room — free. VN JDs mention malware detection/analysis/reverse engineering; this is just enough to speak to it in an interview, not a specialization — full reverse engineering is its own deep track, not needed here." }
    ]
  },
  {
    id: "p4", title: "Portfolio", weeks: "Weeks 14-18",
    note: "This gets you noticed more than the cert alone.",
    tasks: [
      { id: "p4-1", label: "Set up GitHub with a simple portfolio README", detail: "One repo, one README — your name, what you're working toward, and links to your write-ups as you publish them.\n\nDone when: it's live and public." },
      { id: "p4-2", label: "Publish write-ups for investigations 1-5", detail: "Turn 5 of your LetsDefend/TryHackMe investigations into short write-ups: what the alert was, what you found, what you'd do next.\n\nDone when: 5 are published." },
      { id: "p4-3", label: "Publish write-ups for investigations 6-10", detail: "5 more write-ups, same format as the first batch.\n\nDone when: 10 total are published." },
      { id: "p4-4", label: "Publish write-ups for investigations 11-15", detail: "5 more write-ups.\n\nDone when: 15 total are published — a solid portfolio, not just a couple of samples." },
      { id: "p4-5", label: "Update LinkedIn with certs and progress", detail: "Add Security+ (once passed), your GitHub portfolio link, and a headline that says what you're targeting.\n\nDone when: a recruiter skimming your profile for 10 seconds understands what you want." },
      { id: "p4-6", label: "Rewrite CV around Security+, labs, Python background", detail: "Lead with the cert and hands-on lab hours, not your current job title.\n\nFrame your logistics/Python background as a transferable edge, not a detour — it's worth a line, not an apology." }
    ]
  },
  {
    id: "p5", title: "Apply", weeks: "Month 4 onward",
    note: "Tier 1 SOC Analyst and Junior Security Analyst roles.",
    tasks: [
      { id: "p5-1", label: "List 15-20 target companies", detail: "Mix of company sizes. Include the PwC/EY/Bosch/Noventiq-style firms already known to hire entry-level SOC roles in VN, plus VN-domestic cybersecurity firms actively building SOC teams: Viettel Cyber Security, CMC Infosec, VNPT-IT, FPT IS — friendlier to entry-level than the Big 4, plus a few others you find.\n\nDone when: the list exists somewhere you'll actually revisit." },
      { id: "p5-2", label: "Send first 5 applications", detail: "Tailor each one minimally — right job title, right company name in the cover letter, nothing more elaborate needed yet.\n\nDone when: 5 are sent." },
      { id: "p5-3", label: "Prep answers for common SOC interview questions", detail: "Have a real answer ready for: 'walk me through how you'd triage this alert,' 'what's the CIA triad,' and 'tell me about a lab you did.'\n\nDone when: you could answer these out loud without freezing." },

// Small, obviously-placeholder starter for a brand-new account — never the
// current owner's real career-roadmap content.
const PLACEHOLDER_PHASES = [
  {
    id: "ph1", title: "Example Phase", weeks: "Weeks 1-3",
    note: "This is a placeholder — tap \"Edit roadmap\" below to rewrite this into your own plan, phase by phase.",
    tasks: [
      { id: "pt1", label: "Example task — edit or delete this", detail: "Tap Edit on this task to change the label and this detail text, or delete it and add your own." },
      { id: "pt2", label: "Another example task", detail: "" }
    ]
  }
];
const PLACEHOLDER_RESOURCES = [
  { phase: "Example Phase", items: [
    { name: "Example resource", url: "https://example.com", cost: "Free", note: "Add your own links here" }
  ]}
];

const DEFAULT_META = { title: "Zero to SOC Analyst", subtitle: "Your step-by-step path into a Tier 1 SOC role. One task at a time - check it off, and the next one lights up." };
const PLACEHOLDER_META = { title: "Roadmap", subtitle: "Your step-by-step plan, phase by phase. Check off a task, and the next one lights up." };

const STORAGE_KEY = "soc-roadmap-progress";
const NOTES_KEY = "roadmap-notes";
const PLAN_KEY = "roadmap-phases";
let progress = {};
let notes = "";
let phases = [];
let resources = [];
let meta = PLACEHOLDER_META;
let openPhases = new Set();
let loaded = false;
let resetArmed = false;
let notesSaveTimer = null;
let editMode = false;
let editingPhaseId = null;
let editingTaskId = null;
let editingMeta = false;

function flatTasks() {
  return phases.flatMap(p => p.tasks.map(t => ({ ...t, phaseId: p.id, phaseTitle: p.title, phaseWeeks: p.weeks })));
}
function totalCount() { return flatTasks().length; }
function doneCount() { return flatTasks().filter(t => progress[t.id]).length; }
function nextTask() { return flatTasks().find(t => !progress[t.id]) || null; }

async function loadProgress() {
  const [progressValue, notesValue, planValue] = await Promise.all([
    loadData(STORAGE_KEY).catch(() => null),
    loadData(NOTES_KEY).catch(() => null),
    loadData(PLAN_KEY).catch(() => null)
  ]);
  progress = progressValue || {};
  notes = typeof notesValue === "string" ? notesValue : "";

  if (planValue && Array.isArray(planValue.phases)) {
    phases = planValue.phases;
    resources = Array.isArray(planValue.resources) ? planValue.resources : [];
    meta = planValue.meta && planValue.meta.title ? planValue.meta : PLACEHOLDER_META;
  } else {
    const hasEngagement = Object.keys(progress).length > 0 || notes.trim().length > 0;
    phases = JSON.parse(JSON.stringify(hasEngagement ? DEFAULT_PHASES : PLACEHOLDER_PHASES));
    resources = JSON.parse(JSON.stringify(hasEngagement ? DEFAULT_RESOURCES : PLACEHOLDER_RESOURCES));
    meta = JSON.parse(JSON.stringify(hasEngagement ? DEFAULT_META : PLACEHOLDER_META));
    await savePlan();
  }

  document.title = meta.title;
  loaded = true;
  const nt = nextTask();
  if (nt) openPhases.add(nt.phaseId);
  render();
}

async function saveProgress() {
  const ok = await saveData(STORAGE_KEY, progress);
  if (!ok) notifySaveFailed();
}

async function savePlan() {
  const ok = await saveData(PLAN_KEY, { phases, resources, meta });
  if (!ok) notifySaveFailed();
}

function toggleEditMode() {
  editMode = !editMode;
  editingPhaseId = null;
  editingTaskId = null;
  editingMeta = false;
  render();
}

function startEditMeta() {
  editingMeta = true;
  render();
}
function cancelEditMeta() {
  editingMeta = false;
  render();
}
function saveEditMeta(app) {
  const title = app.querySelector("#meta-edit-title").value.trim();
  const subtitle = app.querySelector("#meta-edit-subtitle").value.trim();
  if (!title) return;
  meta = { title, subtitle };
  document.title = title;
  editingMeta = false;
  savePlan();
  render();
}

function startEditPhase(id) {
  editingPhaseId = id;
  render();
}
function cancelEditPhase() {
  editingPhaseId = null;
  render();
}
function saveEditPhase(app, phaseId) {
  const title = app.querySelector("#phase-edit-title").value.trim();
  const weeks = app.querySelector("#phase-edit-weeks").value.trim();
  const note = app.querySelector("#phase-edit-note").value.trim();
  if (!title) return;
  const phase = phases.find(p => p.id === phaseId);
  if (phase) Object.assign(phase, { title, weeks, note });
  editingPhaseId = null;
  savePlan();
  render();
}
function deletePhase(id) {
  phases = phases.filter(p => p.id !== id);
  savePlan();
  render();
}
function addPhase(app) {
  const title = app.querySelector("#new-phase-title").value.trim();
  const weeks = app.querySelector("#new-phase-weeks").value.trim();
  if (!title) return;
  phases.push({ id: uid(), title, weeks, note: "", tasks: [] });
  savePlan();
  render();
}

function startEditTask(id) {
  editingTaskId = id;
  render();
}
function cancelEditTask() {
  editingTaskId = null;
  render();
}
function saveEditTask(app, phaseId, taskId) {
  const label = app.querySelector("#task-edit-label").value.trim();
  const detail = app.querySelector("#task-edit-detail").value.trim();
  if (!label) return;
  const phase = phases.find(p => p.id === phaseId);
  const t = phase && phase.tasks.find(t => t.id === taskId);
  if (t) Object.assign(t, { label, detail });
  editingTaskId = null;
  savePlan();
  render();
}
function deleteTask(phaseId, taskId) {
  const phase = phases.find(p => p.id === phaseId);
  if (!phase) return;
  phase.tasks = phase.tasks.filter(t => t.id !== taskId);
  savePlan();
  render();
}
function addTask(app, phaseId) {
  const label = app.querySelector(`#add-task-label-${phaseId}`).value.trim();
  const detail = app.querySelector(`#add-task-detail-${phaseId}`).value.trim();
  if (!label) return;
  const phase = phases.find(p => p.id === phaseId);
  if (!phase) return;
  phase.tasks.push({ id: uid(), label, detail });
  savePlan();
  render();
}

function addResource(app) {
  const group = app.querySelector("#res-group").value.trim();
  const name = app.querySelector("#res-name").value.trim();
  const url = app.querySelector("#res-url").value.trim();
  const cost = app.querySelector("#res-cost").value.trim();
  const note = app.querySelector("#res-note").value.trim();
  if (!group || !name) return;
  let g = resources.find(r => r.phase === group);
  if (!g) { g = { phase: group, items: [] }; resources.push(g); }
  g.items.push({ name, url, cost, note });
  savePlan();
  render();
}
function deleteResource(groupIdx, itemIdx) {
  resources[groupIdx].items.splice(itemIdx, 1);
  if (resources[groupIdx].items.length === 0) resources.splice(groupIdx, 1);
  savePlan();
  render();
}

function onNotesInput(value) {
  notes = value;
  clearTimeout(notesSaveTimer);
  notesSaveTimer = setTimeout(async () => {
    const ok = await saveData(NOTES_KEY, notes);
    if (!ok) notifySaveFailed();
  }, 600);
}

function toggleTask(id) {
  progress[id] = !progress[id];
  saveProgress();
  const nt = nextTask();
  if (nt) openPhases.add(nt.phaseId);
  render();
}

function armReset() {
  resetArmed = true;
  render();
}

function cancelReset() {
  resetArmed = false;
  render();
}

async function confirmReset() {
  resetArmed = false;
  progress = {};
  await saveProgress();
  openPhases = phases[0] ? new Set([phases[0].id]) : new Set();
  render();
}

function render() {
  const app = document.getElementById("app");
  if (!loaded) { app.innerHTML = '<p class="eyebrow">Loading…</p>'; return; }

  const total = totalCount();
  const done = doneCount();
  const pct = total ? Math.round((done / total) * 100) : 0;
  const nt = nextTask();

  const upNextHtml = nt ? `
    <p class="panel-label">Up next</p>
    <div class="up-next">
      <div class="up-next-meta">
        <span class="ticket-id">${nt.id.toUpperCase()}</span>
        <span>${escapeHtml(nt.phaseTitle)} &middot; ${escapeHtml(nt.phaseWeeks)}</span>
      </div>
      <p class="up-next-task">${escapeHtml(nt.label)}</p>
      <button class="btn" data-action="complete-next" data-id="${nt.id}">Mark done</button>
    </div>
  ` : `
    <p class="panel-label">Status</p>
    <div class="up-next">
      <p class="celebrate">Every task is checked off — nice work.</p>
    </div>
  `;

  const phasesHtml = phases.map((phase, i) => {
    const pDone = phase.tasks.filter(t => progress[t.id]).length;
    const isOpen = openPhases.has(phase.id) || editMode;
    const isCurrentPhase = nt && nt.phaseId === phase.id;
    const tasksHtml = phase.tasks.map(t => {
      const checked = !!progress[t.id];
      const id = `chk-${t.id}`;

      if (editMode && editingTaskId === t.id) {
        return `
          <div class="task-row task-edit-row">
            <div class="task-body">
              <div class="log-form">
                <div class="log-field wide"><label for="task-edit-label">Label</label><input type="text" id="task-edit-label" value="${escapeHtml(t.label)}" /></div>
                <div class="log-field wide"><label for="task-edit-detail">Detail (optional)</label><textarea id="task-edit-detail" rows="3">${escapeHtml(t.detail || "")}</textarea></div>
              </div>
              <div class="log-save-row">
                <button class="btn btn-small" data-action="save-task" data-phase="${phase.id}" data-id="${t.id}" type="button">Save</button>
                <button class="btn btn-ghost btn-small" data-action="cancel-edit-task" type="button">Cancel</button>
              </div>
            </div>
          </div>
        `;
      }

      const detailHtml = t.detail ? `
        <details class="task-detail">
          <summary></summary>
          <div class="detail-body">${formatDetail(t.detail)}</div>
        </details>
      ` : "";
      const editControls = editMode ? `
        <div class="task-edit-controls">
          <button class="btn btn-ghost btn-small" data-action="edit-task" data-id="${t.id}" type="button">Edit</button>
          <button class="btn btn-ghost btn-small" data-action="delete-task" data-phase="${phase.id}" data-id="${t.id}" type="button">Delete</button>
        </div>
      ` : "";
      return `
        <div class="task-row">
          ${editMode ? "" : `<input type="checkbox" id="${id}" data-action="toggle-task" data-id="${t.id}" ${checked ? "checked" : ""} />`}
          <div class="task-body">
            ${editMode ? `<span class="task-label${checked ? " checked" : ""}">${escapeHtml(t.label)}</span>` : `<label for="${id}" class="task-label${checked ? " checked" : ""}">${escapeHtml(t.label)}</label>`}
            ${detailHtml}
          </div>
          ${editControls}
        </div>
      `;
    }).join("");

    const addTaskHtml = editMode ? `
      <div class="task-row task-edit-row">
        <div class="task-body">
          <div class="log-form">
            <div class="log-field wide"><label for="add-task-label-${phase.id}">New task label</label><input type="text" id="add-task-label-${phase.id}" placeholder="e.g. Finish domain 3 notes" /></div>
            <div class="log-field wide"><label for="add-task-detail-${phase.id}">Detail (optional)</label><textarea id="add-task-detail-${phase.id}" rows="2"></textarea></div>
          </div>
          <div class="log-save-row"><button class="btn btn-small" data-action="add-task" data-phase="${phase.id}" type="button">Add task</button></div>
        </div>
      </div>
    ` : "";

    const phaseNoteHtml = editMode && editingPhaseId === phase.id ? `
      <div class="phase-edit-form">
        <div class="log-form">
          <div class="log-field"><label for="phase-edit-title">Title</label><input type="text" id="phase-edit-title" value="${escapeHtml(phase.title)}" /></div>
          <div class="log-field"><label for="phase-edit-weeks">Weeks / timeframe</label><input type="text" id="phase-edit-weeks" value="${escapeHtml(phase.weeks)}" /></div>
          <div class="log-field wide"><label for="phase-edit-note">Note</label><textarea id="phase-edit-note" rows="2">${escapeHtml(phase.note)}</textarea></div>
        </div>
        <div class="log-save-row">
          <button class="btn btn-small" data-action="save-phase" data-id="${phase.id}" type="button">Save</button>

        </div>
      </div>
    ` : `<p class="phase-note">${escapeHtml(phase.note)}</p>`;

    const phaseEditControls = editMode ? `
      <span class="phase-edit-controls">
        <button class="btn btn-ghost btn-small" data-action="edit-phase" data-id="${phase.id}" type="button">Edit</button>
        <button class="btn btn-ghost btn-small" data-action="delete-phase" data-id="${phase.id}" type="button">Delete</button>

    return `
      <details class="phase" data-action="phase" data-id="${phase.id}" ${isOpen ? "open" : ""}>
        <summary>
          <div class="phase-header">
            <span class="phase-num${isCurrentPhase ? " current" : ""}" style="--phase-color:var(--phase${(i % 5) + 1})">${String(i + 1).padStart(2, "0")}</span>
            <span class="phase-text">
              <span class="phase-title">${escapeHtml(phase.title)}</span>
              <span class="phase-weeks">${escapeHtml(phase.weeks)}</span>

        </summary>
        ${phaseNoteHtml}
        ${tasksHtml}
        ${addTaskHtml}
      </details>
    `;

  const addPhaseHtml = editMode ? `

        <div class="log-field wide"><label for="meta-edit-subtitle">Subtitle</label><input type="text" id="meta-edit-subtitle" value="${escapeHtml(meta.subtitle)}" /></div>
      </div>
      <div class="log-save-row">
        <button class="btn btn-small" id="save-meta-btn" type="button">Save</button>
        <button class="btn btn-ghost btn-small" id="cancel-meta-btn" type="button">Cancel</button>
      </div>
    </div>
  ` : `
    <p class="eyebrow">Roadmap</p>
    <h1>${escapeHtml(meta.title)}</h1>
    <p class="subtitle">${escapeHtml(meta.subtitle)}</p>
  `;

  app.innerHTML = `
    ${metaHtml}
    <div class="edit-toggle-row">
      <button class="btn btn-ghost btn-small" id="edit-toggle-btn" type="button">${editMode ? "Done editing" : "Edit roadmap"}</button>
      ${editMode && !editingMeta ? `<button class="btn btn-ghost btn-small" id="edit-meta-btn" type="button">Edit title/subtitle</button>` : ""}

    <details class="resource-box">

      </summary>

        ${resources.map((group, gi) => `
          <div class="resource-group">
            <p class="resource-group-title">${escapeHtml(group.phase)}</p>
            ${group.items.map((r, ii) => `
              <div class="resource-row">
                <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.name)}</a>
                <span class="resource-cost">${escapeHtml(r.cost)}</span>
                <span class="resource-note">${escapeHtml(r.note)}</span>
                ${editMode ? `<button class="row-del" data-action="delete-resource" data-group="${gi}" data-item="${ii}" type="button">&times;</button>` : ""}
              </div>
            `).join("")}
          </div>
        `).join("")}
      </div>
      ${editMode ? `
        <div class="phase-edit-form" style="border-top:1px solid var(--border); padding-top:16px; margin-top:16px;">
          <p class="panel-label">Add a resource</p>
          <div class="log-form">
            <div class="log-field"><label for="res-group">Group</label><input type="text" id="res-group" placeholder="e.g. Foundations" /></div>

              <button data-action="reset-cancel" type="button">Cancel</button>
            </span>
          ` : `<button data-action="reset" type="button">Reset progress</button>`}
        </div>
      </div>
      <div class="col-side">
        <div class="progress">
          <span class="progress-pct">${pct}%</span>
          <span class="progress-meta">
            <span class="progress-count">${done} of ${total} tasks complete</span>
            <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
          </span>
        </div>
        ${upNextHtml}
        <p class="panel-label" style="margin-top:24px;">Notes</p>
        <textarea id="roadmap-notes" class="notes-box" placeholder="Scratch space — questions, links, whatever">${escapeHtml(notes)}</textarea>
      </div>
    </div>
  `;

  app.querySelectorAll('[data-action="toggle-task"]').forEach(el => {
    el.addEventListener("change", () => toggleTask(el.getAttribute("data-id")));
  });
  app.querySelectorAll('details[data-action="phase"]').forEach(el => {
    el.addEventListener("toggle", () => {
      const id = el.getAttribute("data-id");
      if (el.open) openPhases.add(id); else openPhases.delete(id);
    });
  });
  const completeBtn = app.querySelector('[data-action="complete-next"]');
  if (completeBtn) {
    completeBtn.addEventListener("click", () => toggleTask(completeBtn.getAttribute("data-id")));
  }
  const resetBtn = app.querySelector('[data-action="reset"]');
  if (resetBtn) resetBtn.addEventListener("click", armReset);
  const resetConfirmBtn = app.querySelector('[data-action="reset-confirm"]');
  if (resetConfirmBtn) resetConfirmBtn.addEventListener("click", confirmReset);
  const resetCancelBtn = app.querySelector('[data-action="reset-cancel"]');
  if (resetCancelBtn) resetCancelBtn.addEventListener("click", cancelReset);
  const notesBox = app.querySelector("#roadmap-notes");
  if (notesBox) notesBox.addEventListener("input", () => onNotesInput(notesBox.value));

  const editToggleBtn = app.querySelector("#edit-toggle-btn");
  if (editToggleBtn) editToggleBtn.addEventListener("click", toggleEditMode);
  const editMetaBtn = app.querySelector("#edit-meta-btn");
  if (editMetaBtn) editMetaBtn.addEventListener("click", startEditMeta);
  const saveMetaBtn = app.querySelector("#save-meta-btn");
  if (saveMetaBtn) saveMetaBtn.addEventListener("click", () => saveEditMeta(app));
  const cancelMetaBtn = app.querySelector("#cancel-meta-btn");
  if (cancelMetaBtn) cancelMetaBtn.addEventListener("click", cancelEditMeta);
  const doneFab = app.querySelector("#done-editing-fab");
  if (doneFab) doneFab.addEventListener("click", toggleEditMode);
  app.querySelectorAll('[data-action="edit-phase"]').forEach(el => {
    el.addEventListener("click", () => startEditPhase(el.getAttribute("data-id")));
  });
  app.querySelectorAll('[data-action="delete-phase"]').forEach(el => {
    el.addEventListener("click", () => deletePhase(el.getAttribute("data-id")));
  });
  app.querySelectorAll('[data-action="save-phase"]').forEach(el => {
    el.addEventListener("click", () => saveEditPhase(app, el.getAttribute("data-id")));
  });
  app.querySelectorAll('[data-action="cancel-edit-phase"]').forEach(el => {
    el.addEventListener("click", cancelEditPhase);
  });
  const addPhaseBtn = app.querySelector("#add-phase-btn");
  if (addPhaseBtn) addPhaseBtn.addEventListener("click", () => addPhase(app));

  app.querySelectorAll('[data-action="edit-task"]').forEach(el => {
    el.addEventListener("click", () => startEditTask(el.getAttribute("data-id")));
  });
  app.querySelectorAll('[data-action="delete-task"]').forEach(el => {
    el.addEventListener("click", () => deleteTask(el.getAttribute("data-phase"), el.getAttribute("data-id")));
  });
  app.querySelectorAll('[data-action="save-task"]').forEach(el => {
    el.addEventListener("click", () => saveEditTask(app, el.getAttribute("data-phase"), el.getAttribute("data-id")));
  });
  app.querySelectorAll('[data-action="cancel-edit-task"]').forEach(el => {
    el.addEventListener("click", cancelEditTask);
  });
  app.querySelectorAll('[data-action="add-task"]').forEach(el => {
    el.addEventListener("click", () => addTask(app, el.getAttribute("data-phase")));
  });

  app.querySelectorAll('[data-action="delete-resource"]').forEach(el => {
    el.addEventListener("click", () => deleteResource(Number(el.getAttribute("data-group")), Number(el.getAttribute("data-item"))));
  });
  const addResourceBtn = app.querySelector("#add-resource-btn");
  if (addResourceBtn) addResourceBtn.addEventListener("click", () => addResource(app));
}

initAuthUI({
  onSignedIn: () => { if (!loaded) loadProgress(); },
  onSignedOut: () => { loaded = false; }
});
</script>
<script src="./pwa-init.js"></script>
</body>
</html>
