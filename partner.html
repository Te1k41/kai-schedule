<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Partner</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#9E3A26">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="icon" href="./assets/icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kai Ops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared.css">
<style>
  h1 { font-family: var(--font-display); font-size: clamp(24px, 1.7vw, 34px); line-height: 1.2; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-family: var(--font-display); font-size: clamp(19px, 1.2vw, 24px); font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--ink-soft); font-size: var(--fs-sm); line-height: 1.6; margin: 0 0 24px; max-width: 62ch; }
  .shell { max-width: 640px; margin: 0 auto; }

  section.card { margin-bottom: 36px; }

  .now-clock { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--ink-soft); margin: 0 0 8px; }
  .now-clock strong { color: var(--ink); }
  .now-task { font-family: var(--font-display); font-size: clamp(26px, 3vw, 40px); line-height: 1.1; font-weight: 600; margin: 0; color: var(--vermillion); letter-spacing: -0.01em; }
  .now-note { font-size: var(--fs-sm); color: var(--ink-soft); margin: 10px 0 0; white-space: pre-line; line-height: 1.5; }

  .goal-card { padding: 16px 2px; border-top: 1px solid var(--border); }
  .goal-card:first-child { border-top: none; }
  .goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .goal-name { font-weight: 600; font-size: var(--fs-base); }
  .goal-amounts { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-soft); margin-bottom: 6px; }
  .goal-pct { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--vermillion); font-weight: 700; }
  .budget-bar-track { height: 8px; background: var(--paper); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .budget-bar-fill { height: 100%; background: var(--cat-life); }

  .budget-row { padding: 12px 2px; border-top: 1px solid var(--border); }
  .budget-row:first-child { border-top: none; }
  .budget-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .budget-name { font-weight: 600; font-size: var(--fs-base); }
  .budget-amounts { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-soft); }

  .rows-empty { font-size: var(--fs-sm); color: var(--ink-soft); font-style: italic; margin: 0; }
  .footer { margin-top: 20px; font-size: clamp(12.5px, 0.7vw, 15px); }
  .footer a { color: var(--ink-soft); text-decoration: none; }
  .footer a:hover { color: var(--ink); }

  .log-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .log-field { display: flex; flex-direction: column; gap: 5px; }
  .log-field.wide { grid-column: 1 / -1; }
  .log-field label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .log-field input {
    font-family: var(--font-mono); font-size: var(--fs-base); color: var(--ink); background: var(--paper);
    border: 1px solid var(--border); border-radius: 2px; padding: 9px 10px; width: 100%; letter-spacing: 0.08em;
  }
  .log-field input:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 1px; }
  .log-save-row { display: flex; align-items: center; gap: 14px; }

  .connect-code { font-family: var(--font-mono); font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: 0.15em; color: var(--vermillion); margin: 0 0 14px; }
  .connect-error { color: var(--danger); font-size: var(--fs-sm); margin: 0 0 10px; }
</style>
</head>
<body>
  <div class="koi-bg" aria-hidden="true"></div>

  <nav class="top"><a href="./index.html">Home</a><a href="./schedule.html">Schedule</a><a href="./roadmap.html">Roadmap</a><a href="./health.html">Health</a><a href="./finance.html">Finance</a><a href="./partner.html" class="current">Partner</a></nav>

  <p class="eyebrow" id="boot-loading" style="text-align:center; margin-top:60px;">Loading…</p>

  <div class="auth-gate" id="auth-gate" style="display:none;">
    <p class="eyebrow">Sign in</p>
    <h1>One tap to sync</h1>
    <p class="subtitle">Sign in with the same Google account on every device and this stays in sync automatically.</p>
    <button class="btn" id="signin-btn">Sign in with Google</button>
    <p class="auth-error" id="auth-error" style="display:none;"></p>
  </div>

  <p class="signed-in-as" id="signed-in-as" style="display:none;"></p>
  <div class="shell" id="app" style="display:none;">
    <p class="eyebrow">Loading…</p>
  </div>

<script type="module">
import { loadPartnerData, createInvite, redeemInvite, getMyPairing, disconnectPairing } from "./firebase-init.js";
import { escapeHtml, initAuthUI, nowMinutes, nowClockStr, todayAbbrev, findCurrentBlock } from "./app-shell.js";
import { DAYS } from "./schedule-data.js";

let loaded = false;
let partnerUid = null;
let pairId = null;
let goals = [];
let subscriptions = [];
let weekBlocks = null;
let generatedCode = null;
let connectError = "";
let connectBusy = false;

async function loadPartner() {
  const pairing = await getMyPairing();
  if (pairing) {
    partnerUid = pairing.partnerUid;
    pairId = pairing.pairId;
    const [goalsValue, subsValue, scheduleValue] = await Promise.all([
      loadPartnerData(partnerUid, "savings-goals"),
      loadPartnerData(partnerUid, "subscriptions-list"),
      loadPartnerData(partnerUid, "schedule-blocks")
    ]);
    goals = goalsValue || [];
    subscriptions = subsValue || [];
    weekBlocks = scheduleValue || null;
  } else {
    partnerUid = null;
    pairId = null;
  }
  loaded = true;
  render();
}

async function handleGenerateCode() {
  connectBusy = true;
  render();
  generatedCode = await createInvite();
  connectBusy = false;
  render();
}

async function handleRedeem(app) {
  const codeInput = app.querySelector("#connect-code");
  const code = codeInput.value.trim();
  if (!code) return;
  connectBusy = true;
  connectError = "";
  render();
  const result = await redeemInvite(code);
  connectBusy = false;
  if (result.ok) {
    generatedCode = null;
    await loadPartner();
  } else {
    connectError = result.error === "self-pair" ? "That's your own code — get one from your partner instead."
      : result.error === "invalid-code" ? "Code not found — check it and try again."
      : "Something went wrong — try again.";
    render();
  }
}

async function handleDisconnect() {
  if (!pairId) return;
  connectBusy = true;
  render();
  await disconnectPairing(pairId);
  partnerUid = null;
  pairId = null;
  goals = [];
  subscriptions = [];
  weekBlocks = null;
  generatedCode = null;
  connectBusy = false;
  render();
}

function render() {
  const app = document.getElementById("app");
  if (!loaded) { app.innerHTML = '<p class="eyebrow">Loading…</p>'; return; }

  if (!partnerUid) {
    app.innerHTML = `
      <p class="eyebrow">Partner</p>
      <h1>Connect with your partner</h1>
      <p class="subtitle">One-time code, no rooms or passwords — links your two Google accounts so you can each see the other's savings goals, subscriptions, and schedule, read-only.</p>

      <section class="card">
        <h2>Give them a code</h2>
        <p class="subtitle" style="margin-bottom:12px;">Generate a code and send it to your partner however you like (text, chat, etc). They enter it once, below.</p>
        ${generatedCode ? `<p class="connect-code">${escapeHtml(generatedCode)}</p>` : ""}
        <button class="btn" id="gen-code-btn" type="button" ${connectBusy ? "disabled" : ""}>${generatedCode ? "Generate a new code" : "Generate a code"}</button>
      </section>

      <section class="card">
        <h2>Enter their code</h2>
        <div class="log-form">
          <div class="log-field wide"><label for="connect-code">Code</label><input type="text" id="connect-code" placeholder="e.g. AB3D9K" maxlength="6" style="text-transform:uppercase;" /></div>
        </div>
        ${connectError ? `<p class="connect-error">${escapeHtml(connectError)}</p>` : ""}
        <div class="log-save-row"><button class="btn" id="redeem-code-btn" type="button" ${connectBusy ? "disabled" : ""}>Connect</button></div>
      </section>

      <p class="footer"><a href="./index.html">&larr; Kai's Ops</a></p>
    `;
    app.querySelector("#gen-code-btn").addEventListener("click", handleGenerateCode);
    app.querySelector("#redeem-code-btn").addEventListener("click", () => handleRedeem(app));
    return;
  }

  const today = todayAbbrev(DAYS);
  const blocks = weekBlocks ? (weekBlocks[today] || []) : [];
  const current = findCurrentBlock(blocks, nowMinutes());

  const goalsHtml = goals.length ? goals.map(g => {
    const pct = g.target > 0 ? Math.min(100, (g.saved / g.target) * 100) : 0;
    return `
      <div class="goal-card">
        <div class="goal-top">
          <span class="goal-name">${escapeHtml(g.name)}${g.link ? ` <a href="${escapeHtml(g.link)}" target="_blank" rel="noopener">&#8599;</a>` : ""}</span>
          <span class="goal-pct">${pct.toFixed(0)}%</span>
        </div>
        <div class="goal-amounts">${Number(g.saved).toLocaleString()} / ${Number(g.target).toLocaleString()} VND</div>
        <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${pct}%;"></div></div>
      </div>
    `;
  }).join("") : `<p class="rows-empty">No savings goals shared yet.</p>`;

  const subsHtml = subscriptions.length ? subscriptions.map(sub => `
    <div class="budget-row">
      <div class="budget-top">
        <span class="budget-name">${escapeHtml(sub.name)}${sub.link ? ` <a href="${escapeHtml(sub.link)}" target="_blank" rel="noopener">&#8599;</a>` : ""}</span>
        <span class="budget-amounts">${Number(sub.amount).toLocaleString()} VND/mo${sub.dueDay ? ` &middot; due day ${sub.dueDay}` : ""}</span>
      </div>
    </div>
  `).join("") : `<p class="rows-empty">No subscriptions shared yet.</p>`;

  app.innerHTML = `
    <p class="eyebrow">Partner</p>
    <h1>What they're up to</h1>
    <p class="subtitle">Read-only. Their finances stay private — only savings goals, subscriptions, and the daily schedule are shared.</p>
    <button class="btn btn-ghost btn-small" id="disconnect-btn" type="button" ${connectBusy ? "disabled" : ""}>Disconnect</button>

    <section class="card">
      <h2>Right now</h2>
      <p class="now-clock">It's <strong>${nowClockStr()}</strong></p>
      <p class="now-task">${current ? escapeHtml(current.label) : "A quiet gap"}</p>
      ${current && current.note ? `<p class="now-note">${escapeHtml(current.note)}</p>` : ""}
    </section>

    <section class="card">
      <h2>Savings goals</h2>
      ${goalsHtml}
    </section>

    <section class="card">
      <h2>Recurring subscriptions</h2>
      ${subsHtml}
    </section>

    <p class="footer"><a href="./index.html">&larr; Kai's Ops</a></p>
  `;
  app.querySelector("#disconnect-btn").addEventListener("click", handleDisconnect);
}

initAuthUI({
  onSignedIn: () => { if (!loaded) loadPartner(); },
  onSignedOut: () => { loaded = false; }
});

setInterval(() => { if (loaded && partnerUid) render(); }, 30000);
</script>
<script src="./pwa-init.js"></script>
</body>
</html>
