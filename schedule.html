<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Daily Timetable</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#9E3A26">
<script src="./theme-boot.js"></script>
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="icon" href="./assets/icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared.css">
<style>
  h1 { font-family: var(--font-display); font-size: clamp(22px, 1.5vw, 32px); line-height: 1.2; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: clamp(13.5px, 0.8vw, 17px); line-height: 1.5; margin: 0 0 22px; }

  .day-tabs { display: flex; gap: 4px; margin-bottom: 32px; }
  .day-tab {
    flex: 1; font-family: var(--font); font-size: clamp(12.5px, 0.7vw, 15px); font-weight: 700; text-align: center;
    padding: clamp(10px, 0.7vw, 14px) 2px; min-height: 44px; border-radius: 2px; border: 1px solid transparent; background: transparent; color: var(--ink-soft); cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .day-tab.active { background: var(--vermillion); color: var(--paper); }
  .day-tab.is-today:not(.active) { color: var(--ink); border-color: var(--border); }
  .day-tab:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 1px; }

  .layout { display: grid; grid-template-columns: 1fr minmax(220px, clamp(300px, 22vw, 440px)); gap: clamp(56px, 4.5vw, 110px); align-items: start; }
  .col-side { position: sticky; top: 24px; background: var(--paper-deep); border: 1px solid var(--border); border-radius: 2px; padding: 22px 24px; overflow: visible; }
  .col-main { min-width: 0; }

  .now-clock { font-family: var(--font-mono); font-size: clamp(12px, 0.7vw, 15px); color: var(--ink-soft); margin: 0 0 10px; }
  .now-clock strong { color: var(--ink); }
  .now-label { font-size: clamp(11.5px, 0.65vw, 14px); color: var(--ink-soft); margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
  .now-task { font-family: var(--font-display); font-size: clamp(30px, 3.6vw, 60px); line-height: 1.05; font-weight: 600; margin: 0; color: var(--vermillion); letter-spacing: -0.01em; }
  .now-note { font-size: clamp(13.5px, 0.75vw, 16px); color: var(--ink-soft); margin: 12px 0 0; max-width: 46ch; white-space: pre-line; line-height: 1.5; }
  .now-detail-btn {
    font-family: var(--font); font-weight: 700; font-size: clamp(13px, 0.75vw, 15px); border-radius: 2px;
    border: 1px solid var(--vermillion); background: transparent; color: var(--vermillion);
    padding: 8px 16px; margin-top: 16px; cursor: pointer; transition: background-color 0.15s ease, color 0.15s ease;
  }
  .now-detail-btn:hover { background: var(--vermillion); color: var(--paper); }

  .preview-tag { font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 10px; padding-top: 4px; }

  .block { display: flex; align-items: flex-start; gap: 12px; padding: clamp(12px, 0.8vw, 16px) 10px; margin: 0 -10px; border-bottom: 1px solid var(--border); border-left: 3px solid var(--cat-color, transparent); border-radius: 2px; transition: background-color 0.15s ease; }
  .block:hover { background: rgba(var(--ink-rgb),0.035); }
  .block:has(input:checked) { animation: check-flash 0.5s ease; }
  @keyframes check-flash { from { background: rgba(var(--vermillion-rgb),0.1); } to { background: transparent; } }
  .block.current { border-left-color: var(--vermillion); padding-left: 9px; }

  .block input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 19px; height: 19px; margin-top: 2px;
    border: 1.5px solid var(--ink-soft); border-radius: 2px; background: transparent; cursor: pointer; position: relative;
    display: inline-flex; align-items: center; justify-content: center; transition: border-color 0.15s ease, background-color 0.15s ease;
  }
  .block input[type="checkbox"]:hover { border-color: var(--vermillion); }
  .block input[type="checkbox"]:checked { background: var(--vermillion); border-color: var(--vermillion); animation: check-pop 0.22s ease; }
  .block input[type="checkbox"]:checked::after { content: '了'; color: var(--paper); font-size: 12px; font-family: var(--font-display); line-height: 1; }
  @keyframes check-pop { 50% { transform: scale(1.3); } }
  .block input[type="checkbox"]:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 2px; }

  .block-body { flex: 1; min-width: 0; }
  .block-text { display: block; }
  label.block-text { cursor: pointer; }
  label.block-text:hover .block-label { color: var(--vermillion); }
  .block-time { font-family: var(--font-mono); font-size: clamp(11.5px, 0.65vw, 14px); color: var(--ink-soft); margin: 0 0 2px; }
  .block-tag { color: var(--cat-color, var(--ink-soft)); font-weight: 700; }
  .block-tag::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--cat-color, var(--ink-soft)); margin-right: 5px; }
  .block-label { font-size: clamp(15px, 0.85vw, 18px); line-height: 1.45; transition: color 0.15s ease; }
  .block-label.checked { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--border); }
  .block-note { font-size: clamp(13px, 0.7vw, 15px); color: var(--ink-soft); margin: 4px 0 0; white-space: pre-line; line-height: 1.55; }
  .now-badge { font-size: 10px; color: var(--vermillion); font-weight: 700; margin-left: 8px; text-transform: uppercase; letter-spacing: 0.04em; }

  .block-detail { margin-top: 8px; }
  .block-detail summary { list-style: none; cursor: pointer; font-size: clamp(13.5px, 0.75vw, 16px); color: var(--vermillion); font-weight: 700; }
  .block-detail summary::-webkit-details-marker { display: none; }
  .block-detail summary::before { content: '+ Full breakdown'; }
  .block-detail[open] summary::before { content: '– Full breakdown'; }
  .detail-body { line-height: 1.75; font-size: clamp(15.5px, 0.95vw, 18px); color: var(--ink); margin: 10px 0 4px; padding: 12px 14px; border-left: 3px solid var(--vermillion); background: var(--paper-deep); }
  .detail-body .detail-para { margin: 0 0 14px; }
  .detail-body .detail-para:last-child { margin-bottom: 0; }
  .detail-body strong { color: var(--vermillion); font-weight: 700; }

  .footer { margin-top: 20px; font-size: clamp(12.5px, 0.7vw, 15px); color: var(--ink-soft); }

  .edit-toggle-row { margin: -18px 0 20px; }
  .block-edit-controls { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; align-self: center; }
  .block-form { padding: 16px 2px; border-top: 1px solid var(--border); margin-top: 8px; }
  .log-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .log-field { display: flex; flex-direction: column; gap: 5px; }
  .log-field.wide { grid-column: 1 / -1; }
  .log-field label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .log-field input, .log-field select, .log-field textarea {
    font-family: var(--font); font-size: var(--fs-base); color: var(--ink); background: var(--paper);
    border: 1px solid var(--border); border-radius: 2px; padding: 9px 10px; width: 100%; resize: vertical;
  }
  .log-field input:focus-visible, .log-field select:focus-visible, .log-field textarea:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 1px; }
  .log-field input[type="file"] { padding: 6px; font-size: var(--fs-xs); color: var(--ink-soft); }
  .log-field input[type="file"]::file-selector-button, .log-field input[type="file"]::-webkit-file-upload-button {
    font-family: var(--font); font-weight: 700; font-size: 13px; border-radius: 2px;
    border: 1px solid var(--vermillion); background: transparent; color: var(--vermillion);
    padding: 6px 12px; margin-right: 10px; cursor: pointer;
  }
  .log-field input[type="file"]::file-selector-button:hover, .log-field input[type="file"]::-webkit-file-upload-button:hover { opacity: 0.88; }
  .log-save-row { display: flex; align-items: center; gap: 14px; }

  .edit-fab { position: fixed; right: 20px; bottom: 20px; z-index: 50; }
  .edit-fab .btn { box-shadow: 0 4px 16px rgba(33,30,26,0.25); }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; gap: 20px; }
    .col-side { position: static; order: -1; }
  }
</style>
</head>
<body>
  <div class="koi-bg" aria-hidden="true"></div>

  <nav class="top"><a href="./index.html">Home</a><a href="./schedule.html" class="current">Schedule</a><a href="./roadmap.html">Roadmap</a><a href="./health.html">Health</a><a href="./finance.html">Finance</a></nav>

  <p class="eyebrow" id="boot-loading" style="text-align:center; margin-top:60px;">Loading…</p>

  <div class="auth-gate" id="auth-gate" style="display:none;">
    <p class="eyebrow">Sign in</p>
    <h1>One tap to sync</h1>
    <p class="subtitle">Sign in with the same Google account on every device and this stays in sync automatically.</p>
    <button class="btn" id="signin-btn">Sign in with Google</button>
    <p class="auth-error" id="auth-error" style="display:none;"></p>
  </div>

  <p class="signed-in-as" id="signed-in-as" style="display:none;"></p>
  <div class="shell" id="app" style="display:none;">
    <p class="eyebrow">Loading…</p>
  </div>

<script type="module">
import { loadData, saveData } from "./firebase-init.js";
import { escapeHtml, formatDetail, initAuthUI, notifySaveFailed, uid, toMinutes, nowMinutes, nowClockStr, todayAbbrev, findCurrentBlock, loadOrSeedSchedule, SCHEDULE_KEY } from "./app-shell.js";
import { DAYS, DAY_FULL, genericWeekSeed } from "./schedule-data.js";

const CAT_TAGS = { work: "Work", study: "Study", fitness: "Train", life: "Life" };
const CAT_COLOR_VARS = { work: "var(--cat-work)", study: "var(--cat-study)", fitness: "var(--cat-fitness)", life: "var(--cat-life)" };

const STORAGE_KEY = "schedule-today";
let weekBlocks = null;
let checked = {};
let loaded = false;
let editMode = false;
let editingBlockId = null;
let editingMeta = false;
let editingImport = false;

const DEFAULT_SCHEDULE_META = { title: "Your Weekday Timetable", subtitle: "Job, training, meals, and rest — every day of the week, mapped out." };

function todayDateStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

let selectedDay = todayAbbrev(DAYS);

async function loadAll() {
  const [scheduleValue, checkedValue] = await Promise.all([
    loadOrSeedSchedule(genericWeekSeed),
    loadData(STORAGE_KEY).catch(() => null)
  ]);
  weekBlocks = scheduleValue;
  if (!weekBlocks.meta) {
    weekBlocks.meta = { ...DEFAULT_SCHEDULE_META };
    saveSchedule();
  }
  document.title = weekBlocks.meta.title;
  checked = (checkedValue && checkedValue.date === todayDateStr()) ? (checkedValue.checked || {}) : {};
  loaded = true;
  render();
}

async function saveChecked() {
  const ok = await saveData(STORAGE_KEY, { date: todayDateStr(), checked });
  if (!ok) notifySaveFailed();
}

async function saveSchedule() {
  const ok = await saveData(SCHEDULE_KEY, weekBlocks);
  if (!ok) notifySaveFailed();
}

function toggleBlock(start) {
  checked[start] = !checked[start];
  saveChecked();
  render();
}

function startEditBlock(id) {
  editingBlockId = id;
  render();
}

function cancelEdit() {
  editingBlockId = null;
  render();
}

function toggleEditMode() {
  editMode = !editMode;
  editingBlockId = null;
  editingMeta = false;
  editingImport = false;
  render();
}

function startImport() {
  editingImport = true;
  editingBlockId = null;
  render();
}
function cancelImport() {
  editingImport = false;
  render();
}

// Validates and normalizes one day's array of blocks from parsed JSON.
// Throws with a plain-language message on the first problem found.
function normalizeImportedBlocks(arr, dayLabel) {
  if (!Array.isArray(arr)) throw new Error(`${dayLabel}: expected an array of blocks`);
  const catKeys = Object.keys(CAT_TAGS);
  return arr.map((b, i) => {
    if (!b || typeof b !== "object") throw new Error(`${dayLabel} block ${i + 1}: not an object`);
    if (!/^\d{2}:\d{2}$/.test(b.start || "")) throw new Error(`${dayLabel} block ${i + 1}: bad or missing "start" (need HH:MM)`);
    if (!/^\d{2}:\d{2}$/.test(b.end || "")) throw new Error(`${dayLabel} block ${i + 1}: bad or missing "end" (need HH:MM)`);
    if (!catKeys.includes(b.cat)) throw new Error(`${dayLabel} block ${i + 1}: unknown category "${b.cat}" (use ${catKeys.join("/")})`);
    if (!b.label) throw new Error(`${dayLabel} block ${i + 1}: missing "label"`);
    return { id: b.id || uid(), start: b.start, end: b.end, cat: b.cat, label: b.label, note: b.note || "", detail: b.detail || "" };
  }).sort((a, b) => toMinutes(a.start) - toMinutes(b.start));
}

// Accepts either a single day's block array (replaces just the selected day)
// or a whole-week object keyed by day abbreviation (replaces every day it
// includes) — so a full week can be imported in one paste/file instead of
// switching day tabs one at a time.
function importJsonForm(app) {
  const raw = app.querySelector("#import-text").value.trim();
  if (!raw) { notifySaveFailed("Paste JSON or choose a file first."); return; }
  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    notifySaveFailed(`Invalid JSON: ${e.message}`);
    return;
  }
  try {
    if (Array.isArray(data)) {
      weekBlocks[selectedDay] = normalizeImportedBlocks(data, DAY_FULL[selectedDay]);
    } else if (data && typeof data === "object") {
      const days = DAYS.filter(d => d in data);
      if (!days.length) throw new Error(`No day keys found (expected one of ${DAYS.join("/")})`);
      days.forEach(d => { weekBlocks[d] = normalizeImportedBlocks(data[d], DAY_FULL[d]); });
    } else {
      throw new Error("Expected an array of blocks, or an object keyed by day (Mon, Tue, ...)");
    }
  } catch (e) {
    notifySaveFailed(e.message);
    return;
  }
  editingImport = false;
  saveSchedule();
  render();
}

function startEditMeta() {
  editingMeta = true;
  render();
}
function cancelEditMeta() {
  editingMeta = false;
  render();
}
function saveEditMeta(app) {
  const title = app.querySelector("#meta-edit-title").value.trim();
  const subtitle = app.querySelector("#meta-edit-subtitle").value.trim();
  if (!title) return;
  weekBlocks.meta = { title, subtitle };
  document.title = title;
  editingMeta = false;
  saveSchedule();
  render();
}

function saveBlockForm(app) {
  const start = app.querySelector("#blk-start").value;
  const end = app.querySelector("#blk-end").value;
  const cat = app.querySelector("#blk-cat").value;
  const label = app.querySelector("#blk-label").value.trim();
  const note = app.querySelector("#blk-note").value.trim();
  const detail = app.querySelector("#blk-detail").value.trim();
  if (!start || !end || !label) return;
  const dayBlocks = weekBlocks[selectedDay];
  if (editingBlockId) {
    const b = dayBlocks.find(x => x.id === editingBlockId);
    if (b) Object.assign(b, { start, end, cat, label, note, detail });
  } else {
    dayBlocks.push({ id: uid(), start, end, cat, label, note, detail });
  }
  dayBlocks.sort((a, b) => toMinutes(a.start) - toMinutes(b.start));
  editingBlockId = null;
  saveSchedule();
  render();
}

function deleteBlock(id) {
  weekBlocks[selectedDay] = weekBlocks[selectedDay].filter(b => b.id !== id);
  saveSchedule();
  render();
}

function render() {
  const app = document.getElementById("app");
  if (!loaded) { app.innerHTML = '<p class="eyebrow">Loading…</p>'; return; }

  const isToday = selectedDay === todayAbbrev(DAYS);

  const tabsHtml = DAYS.map(d => `
    <button class="day-tab${d===selectedDay ? " active" : ""}${d===todayAbbrev(DAYS) ? " is-today" : ""}" data-action="select-day" data-day="${d}">${d}</button>
  `).join("");

  let leftHtml = "";
  let rightHtml = "";

  const blocks = weekBlocks[selectedDay] || [];
  const nm = nowMinutes();
  const current = isToday ? findCurrentBlock(blocks, nm) : null;

  if (isToday) {
    leftHtml = `
      <div class="now">
        <p class="now-clock">It's <strong>${nowClockStr()}</strong></p>
        <p class="now-label">You should be in</p>
        <p class="now-task">${current ? escapeHtml(current.label) : "A quiet gap"}</p>
        ${current && current.note ? `<p class="now-note">${escapeHtml(current.note)}</p>` : ""}
        ${current && current.detail ? `<button class="now-detail-btn" data-action="jump-to-detail" data-start="${current.start}" type="button">See details &darr;</button>` : ""}
      </div>
    `;
  } else {
    leftHtml = `<p class="preview-tag">Previewing ${DAY_FULL[selectedDay]}</p>`;
  }

  rightHtml = blocks.map(b => {
    const isCurrent = current && b.start === current.start;
    const isChecked = isToday && !!checked[b.start];
    const interactive = isToday && !editMode;
    const id = `chk-${b.start}`;
    const textInner = `
      <p class="block-time"><span class="block-tag">${CAT_TAGS[b.cat]}</span> · ${b.start}–${b.end}${isCurrent ? '<span class="now-badge">Now</span>' : ""}</p>
      <p class="block-label${isChecked ? " checked" : ""}">${escapeHtml(b.label)}</p>
    `;
    const textHtml = interactive
      ? `<label class="block-text" for="${id}">${textInner}</label>`
      : `<div class="block-text">${textInner}</div>`;
    const noteHtml = b.note ? `<p class="block-note">${escapeHtml(b.note)}</p>` : "";
    const detailHtml = b.detail ? `
      <details class="block-detail" id="detail-${b.start}">
        <summary></summary>
        <div class="detail-body">${formatDetail(b.detail)}</div>
      </details>
    ` : "";
    const checkboxHtml = interactive ? `<input type="checkbox" id="${id}" data-action="toggle-block" data-start="${b.start}" ${isChecked ? "checked" : ""} />` : "";
    const editControls = editMode ? `
      <div class="block-edit-controls">
        <button class="btn btn-ghost btn-small" data-action="edit-block" data-id="${b.id}" type="button">Edit</button>
        <button class="btn btn-ghost btn-small" data-action="delete-block" data-id="${b.id}" type="button">Delete</button>
      </div>
    ` : "";
    return `
      <div class="block${isCurrent ? " current" : ""}" style="--cat-color:${CAT_COLOR_VARS[b.cat]}">
        ${checkboxHtml}
        <div class="block-body">${textHtml}${noteHtml}${detailHtml}</div>
        ${editControls}
      </div>
    `;
  }).join("");

  if (editMode && editingImport) {
    rightHtml += `
      <div class="block-form">
        <p class="eyebrow" style="margin-top:20px;">Import JSON</p>
        <p class="subtitle" style="margin-bottom:10px;">Either a single day — an array of <code>{start, end, cat, label, note, detail}</code> objects, replacing just ${DAY_FULL[selectedDay]} — or a whole week — an object keyed by day (<code>${DAYS.join(", ")}</code>), replacing every day it includes. <code>cat</code> must be one of: ${Object.keys(CAT_TAGS).join(", ")}. <code>note</code>/<code>detail</code> are optional.</p>
        <div class="log-field wide"><label for="import-file">Choose a .json file (optional)</label><input type="file" id="import-file" accept="application/json,.json" /></div>
        <textarea id="import-text" rows="10" style="width:100%; font-family:var(--font-mono); font-size:var(--fs-sm); color:var(--ink); background:var(--paper); border:1px solid var(--border); border-radius:2px; padding:9px 10px;" placeholder='[{"start":"06:25","end":"06:40","cat":"life","label":"Wake + intention"}, ...]'></textarea>
        <div class="log-save-row">
          <button class="btn" id="import-blocks-save-btn" type="button">Import</button>
          <button class="btn btn-ghost btn-small" id="cancel-import-btn" type="button">Cancel</button>
        </div>
      </div>
    `;
  } else if (editMode) {
    const editing = editingBlockId ? blocks.find(b => b.id === editingBlockId) : null;
    rightHtml += `
      <div class="block-form">
        <p class="eyebrow" style="margin-top:20px;">${editing ? "Edit block" : `Add a block to ${DAY_FULL[selectedDay]}`}</p>
        <div class="log-form">
          <div class="log-field"><label for="blk-start">Start</label><input type="time" id="blk-start" value="${editing ? editing.start : ""}" /></div>
          <div class="log-field"><label for="blk-end">End</label><input type="time" id="blk-end" value="${editing ? editing.end : ""}" /></div>
          <div class="log-field"><label for="blk-cat">Category</label>
            <select id="blk-cat">${Object.entries(CAT_TAGS).map(([k, v]) => `<option value="${k}" ${editing && editing.cat === k ? "selected" : ""}>${v}</option>`).join("")}</select>
          </div>
          <div class="log-field wide"><label for="blk-label">Label</label><input type="text" id="blk-label" value="${editing ? escapeHtml(editing.label) : ""}" placeholder="e.g. Deep work" /></div>
          <div class="log-field wide"><label for="blk-note">Note (optional)</label><input type="text" id="blk-note" value="${editing ? escapeHtml(editing.note || "") : ""}" /></div>
          <div class="log-field wide"><label for="blk-detail">Full breakdown (optional)</label><textarea id="blk-detail" rows="3">${editing ? escapeHtml(editing.detail || "") : ""}</textarea></div>
        </div>
        <div class="log-save-row">
          <button class="btn" id="save-block-btn" type="button">${editing ? "Save changes" : "Add block"}</button>
          ${editing ? `<button class="btn btn-ghost btn-small" id="cancel-edit-btn" type="button">Cancel</button>` : ""}
        </div>
      </div>
    `;
  }

  const metaHtml = editMode && editingMeta ? `
    <div class="block-form" style="border-top:none; padding-top:0;">
      <div class="log-form">
        <div class="log-field wide"><label for="meta-edit-title">Page title</label><input type="text" id="meta-edit-title" value="${escapeHtml(weekBlocks.meta.title)}" /></div>
        <div class="log-field wide"><label for="meta-edit-subtitle">Subtitle</label><input type="text" id="meta-edit-subtitle" value="${escapeHtml(weekBlocks.meta.subtitle)}" /></div>
      </div>
      <div class="log-save-row">
        <button class="btn btn-small" id="save-meta-btn" type="button">Save</button>
        <button class="btn btn-ghost btn-small" id="cancel-meta-btn" type="button">Cancel</button>
      </div>
    </div>
  ` : `
    <p class="eyebrow">Schedule</p>
    <h1>${escapeHtml(weekBlocks.meta.title)}</h1>
    <p class="subtitle">${escapeHtml(weekBlocks.meta.subtitle)}</p>
  `;

  app.innerHTML = `
    ${metaHtml}
    <div class="day-tabs">${tabsHtml}</div>
    <div class="edit-toggle-row">
      <button class="btn btn-ghost btn-small" id="edit-toggle-btn" type="button">${editMode ? "Done editing" : "Edit schedule"}</button>
      ${editMode && !editingMeta ? `<button class="btn btn-ghost btn-small" id="edit-meta-btn" type="button">Edit title/subtitle</button>` : ""}
      ${editMode && !editingImport ? `<button class="btn btn-ghost btn-small" id="import-blocks-btn" type="button">Import JSON</button>` : ""}
    </div>
    ${editMode ? `<div class="edit-fab"><button class="btn btn-small" id="done-editing-fab" type="button">Done editing</button></div>` : ""}
    <div class="layout">
      <div class="col-main">${rightHtml}</div>
      <div class="col-side">${leftHtml}</div>
    </div>
    <p class="footer">Today's checks save automatically</p>
  `;

  app.querySelectorAll('[data-action="select-day"]').forEach(el => {
    el.addEventListener("click", () => { selectedDay = el.getAttribute("data-day"); editingBlockId = null; render(); });
  });
  app.querySelectorAll('[data-action="toggle-block"]').forEach(el => {
    el.addEventListener("change", () => toggleBlock(el.getAttribute("data-start")));
  });
  app.querySelectorAll('[data-action="jump-to-detail"]').forEach(el => {
    el.addEventListener("click", () => {
      const det = document.getElementById(`detail-${el.getAttribute("data-start")}`);
      if (!det) return;
      det.open = true;
      det.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });
  app.querySelector("#edit-toggle-btn").addEventListener("click", toggleEditMode);
  app.querySelectorAll('[data-action="edit-block"]').forEach(el => {
    el.addEventListener("click", () => startEditBlock(el.getAttribute("data-id")));
  });
  app.querySelectorAll('[data-action="delete-block"]').forEach(el => {
    el.addEventListener("click", () => deleteBlock(el.getAttribute("data-id")));
  });
  const saveBlockBtn = app.querySelector("#save-block-btn");
  if (saveBlockBtn) saveBlockBtn.addEventListener("click", () => saveBlockForm(app));
  const cancelEditBtn = app.querySelector("#cancel-edit-btn");
  if (cancelEditBtn) cancelEditBtn.addEventListener("click", cancelEdit);
  const editMetaBtn = app.querySelector("#edit-meta-btn");
  if (editMetaBtn) editMetaBtn.addEventListener("click", startEditMeta);
  const saveMetaBtn = app.querySelector("#save-meta-btn");
  if (saveMetaBtn) saveMetaBtn.addEventListener("click", () => saveEditMeta(app));
  const cancelMetaBtn = app.querySelector("#cancel-meta-btn");
  if (cancelMetaBtn) cancelMetaBtn.addEventListener("click", cancelEditMeta);
  const importBtn = app.querySelector("#import-blocks-btn");
  if (importBtn) importBtn.addEventListener("click", startImport);
  const importSaveBtn = app.querySelector("#import-blocks-save-btn");
  if (importSaveBtn) importSaveBtn.addEventListener("click", () => importJsonForm(app));
  const cancelImportBtn = app.querySelector("#cancel-import-btn");
  if (cancelImportBtn) cancelImportBtn.addEventListener("click", cancelImport);
  const importFileInput = app.querySelector("#import-file");
  if (importFileInput) importFileInput.addEventListener("change", () => {
    const file = importFileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { app.querySelector("#import-text").value = reader.result; };
    reader.readAsText(file);
  });
  const doneFab = app.querySelector("#done-editing-fab");
  if (doneFab) doneFab.addEventListener("click", toggleEditMode);
}

initAuthUI({
  onSignedIn: () => { if (!loaded) loadAll(); },
  onSignedOut: () => { loaded = false; }
});

setInterval(() => { if (loaded) render(); }, 30000);
</script>
<script src="./pwa-init.js"></script>
</body>
</html>
