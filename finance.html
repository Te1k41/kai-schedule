<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Finance</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#9E3A26">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kai Ops">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared.css">
<style>
  h1 { font-family: var(--font-display); font-size: clamp(24px, 1.7vw, 34px); line-height: 1.2; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-family: var(--font-display); font-size: clamp(19px, 1.2vw, 24px); font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--ink-soft); font-size: var(--fs-sm); line-height: 1.6; margin: 0 0 24px; max-width: 62ch; }

  .layout { display: grid; grid-template-columns: 1fr minmax(240px, clamp(300px, 22vw, 400px)); gap: clamp(56px, 4.5vw, 110px); align-items: start; }
  .col-side { position: sticky; top: 24px; background: var(--paper-deep); border: 1px solid var(--border); border-radius: 2px; padding: 22px 24px; }
  .col-main { min-width: 0; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; gap: 20px; } .col-side { position: static; } }

  section.card { margin-bottom: 44px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 26px; }
  .stat { background: var(--paper); padding: 14px 16px; }
  .stat-label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin: 0 0 4px; }
  .stat-value { font-family: var(--font-display); font-size: clamp(18px, 1.3vw, 24px); font-weight: 600; color: var(--vermillion); }
  .stat-value.small { font-size: clamp(15px, 1vw, 18px); }
  .stat-value.good { color: var(--cat-life); }
  .stat-value.bad { color: var(--danger); }

  .log-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .log-field { display: flex; flex-direction: column; gap: 5px; }
  .log-field.wide { grid-column: 1 / -1; }
  .log-field label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); min-height: 2.2em; display: flex; align-items: flex-end; }
  .log-field input[type="number"], .log-field input[type="text"], .log-field input[type="date"], .log-field input[type="month"], .log-field input[type="url"], .log-field select {
    font-family: var(--font); font-size: var(--fs-base); color: var(--ink); background: var(--paper);
    border: 1px solid var(--border); border-radius: 2px; padding: 9px 10px; width: 100%;
  }
  .log-field input:focus-visible, .log-field select:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 1px; }
  .log-save-row { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .log-saved-note { font-size: var(--fs-xs); color: var(--ink-soft); }

  .table-scroll { overflow-x: auto; margin-bottom: 12px; }
  .rows-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); min-width: 480px; }
  .rows-table th, .rows-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .rows-table th { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); font-weight: 600; }
  .rows-table td.num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
  .rows-table tr[data-cat] td:first-child { border-left: 3px solid var(--cat-color, var(--cat-life)); padding-left: 8px; }
  .cat-edit { font-family: var(--font); font-size: var(--fs-2xs); color: var(--ink); background: var(--paper); border: 1px solid var(--border); border-radius: 2px; padding: 3px 4px; }
  .row-del { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; }
  .row-del:hover { color: var(--danger); }
  .rows-empty { font-size: var(--fs-sm); color: var(--ink-soft); font-style: italic; margin: 0 0 12px; }

  .budget-row { padding: 12px 2px; border-top: 1px solid var(--border); }
  .budget-row:first-child { border-top: none; }
  .budget-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .budget-name { font-weight: 600; font-size: var(--fs-base); }
  .budget-amounts { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-soft); }
  .budget-amounts.over { color: var(--danger); font-weight: 700; }
  .budget-bar-track { height: 8px; background: var(--paper); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .budget-bar-fill { height: 100%; background: var(--cat-life); transition: width 0.2s ease; }
  .budget-bar-fill.over { background: var(--danger); }
  .budget-edit { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .budget-edit input { width: 110px; font-family: var(--font); font-size: var(--fs-xs); color: var(--ink); background: var(--paper); border: 1px solid var(--border); border-radius: 2px; padding: 5px 8px; }

  .goal-card { padding: 16px 2px; border-top: 1px solid var(--border); }
  .goal-card:first-child { border-top: none; }
  .goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .goal-name { font-weight: 600; font-size: var(--fs-base); }
  .goal-amounts { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-soft); }
  .goal-pct { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--vermillion); font-weight: 700; }

  .converter { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .converter-row { display: flex; align-items: center; gap: 10px; }
  .converter-row input { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: var(--fs-base); color: var(--ink); background: var(--paper); border: 1px solid var(--border); border-radius: 2px; padding: 9px 10px; }
  .converter-row span { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-soft); width: 42px; flex-shrink: 0; }
  .converter-rate { font-size: var(--fs-2xs); color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .converter-rate button { background: none; border: none; color: var(--vermillion); cursor: pointer; font-size: var(--fs-2xs); text-decoration: underline; padding: 0; }
  .converter-equiv { font-size: var(--fs-xs); color: var(--ink); line-height: 1.6; margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--border); }
  .converter-equiv li { margin: 0 0 4px; }

  .footer { margin-top: 20px; font-size: clamp(12.5px, 0.7vw, 15px); color: var(--ink-soft); }

  .cal-header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-month-label { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--ink-soft); min-width: 12ch; text-align: center; }
  .cal-summary { display: flex; gap: 14px; font-family: var(--font-mono); font-size: var(--fs-xs); margin-bottom: 14px; flex-wrap: wrap; }
  .cal-summary-income { color: var(--cat-life); }
  .cal-summary-expense { color: var(--danger); }
  .cal-summary-net.good { color: var(--cat-life); font-weight: 700; }
  .cal-summary-net.bad { color: var(--danger); font-weight: 700; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; font-size: var(--fs-2xs); color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; text-align: center; margin-bottom: 4px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .cal-cell { background: var(--paper); min-height: 68px; padding: 5px 6px; display: flex; flex-direction: column; gap: 2px; }
  .cal-cell.cal-empty { background: transparent; }
  .cal-cell.cal-today { background: var(--paper-deep); box-shadow: inset 0 0 0 1.5px var(--vermillion); }
  .cal-day { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--ink-soft); }
  .cal-today .cal-day { color: var(--vermillion); font-weight: 700; }
  .cal-income { font-family: var(--font-mono); font-size: 11px; color: var(--cat-life); }
  .cal-expense { font-family: var(--font-mono); font-size: 11px; color: var(--danger); }
  .cal-bill { font-size: 10.5px; color: var(--gold); background: var(--paper-deep); border-radius: 2px; padding: 1px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 560px) {
    .cal-cell { min-height: 52px; padding: 3px 4px; }
    .cal-bill { display: none; }
  }

  @media (max-width: 860px) {
    .card-hero .log-field.amount input {
      font-family: var(--font-display); font-size: clamp(28px, 9vw, 40px); font-weight: 600;
      color: var(--vermillion); padding: 6px 10px;
    }
  }
</style>
</head>
<body>
  <div class="koi-bg" aria-hidden="true"></div>

  <nav class="top"><a href="./index.html">Home</a><a href="./schedule.html">Schedule</a><a href="./roadmap.html">Roadmap</a><a href="./health.html">Health</a><a href="./finance.html" class="current">Finance</a></nav>

  <p class="eyebrow" id="boot-loading" style="text-align:center; margin-top:60px;">Loading…</p>

  <div class="auth-gate" id="auth-gate" style="display:none;">
    <p class="eyebrow">Sign in</p>
    <h1>One tap to sync</h1>
    <p class="subtitle">Sign in with the same Google account on every device and this stays in sync automatically.</p>
    <button class="btn" id="signin-btn">Sign in with Google</button>
    <p class="auth-error" id="auth-error" style="display:none;"></p>
  </div>

  <p class="signed-in-as" id="signed-in-as" style="display:none;"></p>
  <div class="shell" id="app" style="display:none;">
    <p class="eyebrow">Loading…</p>
  </div>

<script type="module">
import { loadData, saveData } from "./firebase-init.js";
import { escapeHtml, initAuthUI, notifySaveFailed } from "./app-shell.js";
import { STORAGE_KEY, CATEGORIES, CAT_LABEL, CAT_COLOR, defaultFinanceData, uid, fmtVnd, parseAmount, attachThousandsInput, accountBalance, accountName, totalBalance } from "./finance-core.js";

const AVG_DAILY_FOOD_COST_VND = 72000;
const EGG_COST_VND = 3200;
const TRYHACKME_MONTHLY_USD = 14;

let data = defaultFinanceData();
let loaded = false;
let rate = { usdToVnd: null, updatedAt: null };
let markupPct = Number(localStorage.getItem("finance-usd-markup") ?? 11.7);
let handledHash = false;
let calYear = new Date().getFullYear();
let calMonthIdx = new Date().getMonth();

function effectiveRate() { return rate.usdToVnd ? rate.usdToVnd * (1 + markupPct / 100) : null; }

function todayDateStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function currentMonthKey() { return todayDateStr().slice(0, 7); }
function fmtUsd(n) { return rate.usdToVnd ? "$" + (n / rate.usdToVnd).toFixed(2) : ""; }
function fmtBoth(n) { const usd = fmtUsd(n); return usd ? `${fmtVnd(n)} (${usd})` : fmtVnd(n); }

async function loadFinance() {
  try {
    const value = await loadData(STORAGE_KEY);
    if (value) data = { ...defaultFinanceData(), ...value };
  } catch (e) {
    data = defaultFinanceData();
  }
  loaded = true;
  const logged = applyRecurringSubscriptions();
  if (logged) await saveFinance();
  render();
}

function applyRecurringSubscriptions() {
  const mk = currentMonthKey();
  let changed = false;
  for (const sub of data.subscriptions) {
    if (sub.endMonth && mk > sub.endMonth) continue;
    if (sub.lastLoggedMonth !== mk) {
      data.expenses.push({ id: uid(), date: todayDateStr(), category: sub.category, amount: sub.amount, note: `${sub.name} (auto)`, account: sub.account });
      sub.lastLoggedMonth = mk;
      changed = true;
    }
  }
  return changed;
}

async function saveFinance() {
  const ok = await saveData(STORAGE_KEY, data);
  if (!ok) notifySaveFailed();
}

function monthTotal(list) {
  const mk = currentMonthKey();
  return list.filter(e => e.date && e.date.startsWith(mk)).reduce((sum, e) => sum + Number(e.amount || 0), 0);
}

function categoryMonthTotal(catKey) {
  const mk = currentMonthKey();
  return data.expenses.filter(e => e.date && e.date.startsWith(mk) && e.category === catKey).reduce((sum, e) => sum + Number(e.amount || 0), 0);
}

function accountOptionsHtml(selectedId) {
  if (!data.accounts.length) return `<option value="">No accounts yet</option>`;
  return data.accounts.map(a => `<option value="${a.id}" ${a.id === selectedId ? "selected" : ""}>${escapeHtml(a.name)}</option>`).join("");
}

function addAccount(app) {
  const name = app.querySelector("#acc-name").value.trim();
  const startingBalance = parseAmount(app.querySelector("#acc-start").value);
  if (!name) return;
  data.accounts.push({ id: uid(), name, startingBalance });
  saveFinance();
  render();
}

function addIncome(app) {
  const date = app.querySelector("#inc-date").value || todayDateStr();
  const source = app.querySelector("#inc-source").value.trim();
  const amount = parseAmount(app.querySelector("#inc-amount").value);
  const account = app.querySelector("#inc-account").value;
  if (!amount) return;
  data.income.push({ id: uid(), date, source: source || "Income", amount, account });
  saveFinance();
  render();
}

function addExpense(app) {
  const date = app.querySelector("#exp-date").value || todayDateStr();
  const category = app.querySelector("#exp-category").value;
  const account = app.querySelector("#exp-account").value;
  const amount = parseAmount(app.querySelector("#exp-amount").value);
  const note = app.querySelector("#exp-note").value.trim();
  const link = app.querySelector("#exp-link").value.trim();
  if (!amount) return;
  data.expenses.push({ id: uid(), date, category, amount, note, account, link });
  saveFinance();
  render();
}

function removeEntry(list, id) {
  data[list] = data[list].filter(e => e.id !== id);
  saveFinance();
  render();
}

function setEntryCategory(list, id, category) {
  const entry = data[list].find(e => e.id === id);
  if (!entry) return;
  entry.category = category;
  saveFinance();
  render();
}

function addSubscription(app) {
  const name = app.querySelector("#sub-name").value.trim();
  const category = app.querySelector("#sub-category").value;
  const account = app.querySelector("#sub-account").value;
  const amount = parseAmount(app.querySelector("#sub-amount").value);
  const dueDay = Number(app.querySelector("#sub-dueday").value) || null;
  const endMonth = app.querySelector("#sub-end").value || null;
  const link = app.querySelector("#sub-link").value.trim();
  if (!name || !amount) return;
  data.subscriptions.push({ id: uid(), name, category, account, amount, dueDay, endMonth, link, lastLoggedMonth: null });
  applyRecurringSubscriptions();
  saveFinance();
  render();
}

function shiftCalendar(delta) {
  calMonthIdx += delta;
  if (calMonthIdx < 0) { calMonthIdx = 11; calYear--; }
  else if (calMonthIdx > 11) { calMonthIdx = 0; calYear++; }
  render();
}

function daysInMonth(year, monthIdx) { return new Date(year, monthIdx + 1, 0).getDate(); }
function firstWeekdayOfMonth(year, monthIdx) { return new Date(year, monthIdx, 1).getDay(); }

function calendarHtml() {
  const y = calYear, m = calMonthIdx;
  const mk = `${y}-${String(m + 1).padStart(2, "0")}`;
  const dim = daysInMonth(y, m);
  const startWeekday = firstWeekdayOfMonth(y, m);
  const todayStr = todayDateStr();

  const incomeByDay = {}, expenseByDay = {};
  let monthIncomeTotal = 0, monthExpenseTotal = 0;
  data.income.forEach(e => {
    if (!e.date || !e.date.startsWith(mk)) return;
    const d = Number(e.date.slice(8, 10));
    incomeByDay[d] = (incomeByDay[d] || 0) + Number(e.amount || 0);
    monthIncomeTotal += Number(e.amount || 0);
  });
  data.expenses.forEach(e => {
    if (!e.date || !e.date.startsWith(mk)) return;
    const d = Number(e.date.slice(8, 10));
    expenseByDay[d] = (expenseByDay[d] || 0) + Number(e.amount || 0);
    monthExpenseTotal += Number(e.amount || 0);
  });
  const billsByDay = {};
  data.subscriptions.forEach(s => {
    if (!s.dueDay) return;
    if (s.endMonth && mk > s.endMonth) return;
    (billsByDay[s.dueDay] ||= []).push(s);
  });

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push('<div class="cal-cell cal-empty"></div>');
  for (let d = 1; d <= dim; d++) {
    const dateStr = `${mk}-${String(d).padStart(2, "0")}`;
    const inc = incomeByDay[d] || 0;
    const exp = expenseByDay[d] || 0;
    const bills = billsByDay[d] || [];
    cells.push(`
      <div class="cal-cell${dateStr === todayStr ? " cal-today" : ""}">
        <span class="cal-day">${d}</span>
        ${inc ? `<span class="cal-income">+${fmtVnd(inc)}</span>` : ""}
        ${exp ? `<span class="cal-expense">&minus;${fmtVnd(exp)}</span>` : ""}
        ${bills.map(b => `<span class="cal-bill" title="${escapeHtml(b.name)} due &middot; ${fmtVnd(b.amount)}">${escapeHtml(b.name)}</span>`).join("")}
      </div>
    `);
  }

  const monthLabel = new Date(y, m, 1).toLocaleString("en-US", { month: "long", year: "numeric" });
  const net = monthIncomeTotal - monthExpenseTotal;

  return `
    <section class="card">
      <div class="cal-header">
        <h2>Calendar</h2>
        <div class="cal-nav">
          <button class="btn btn-ghost btn-small" id="cal-prev" type="button" aria-label="Previous month">&larr;</button>
          <span class="cal-month-label">${monthLabel}</span>
          <button class="btn btn-ghost btn-small" id="cal-next" type="button" aria-label="Next month">&rarr;</button>
        </div>
      </div>
      <p class="subtitle" style="margin-bottom:12px;">Green = income logged that day. Red = spend logged that day. Gold pill = a subscription's due day, from Recurring subscriptions below.</p>
      <div class="cal-summary">
        <span class="cal-summary-income">+${fmtVnd(monthIncomeTotal)}</span>
        <span class="cal-summary-expense">&minus;${fmtVnd(monthExpenseTotal)}</span>
        <span class="cal-summary-net ${net >= 0 ? "good" : "bad"}">net ${net >= 0 ? "+" : ""}${fmtVnd(net)}</span>
      </div>
      <div class="cal-weekdays"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
      <div class="cal-grid">${cells.join("")}</div>
    </section>
  `;
}

function setBudget(catKey, value) {
  data.budgets[catKey] = parseAmount(value);
  saveFinance();
  render();
}

function addGoal(app) {
  const name = app.querySelector("#goal-name").value.trim();
  const target = parseAmount(app.querySelector("#goal-target").value);
  const saved = parseAmount(app.querySelector("#goal-saved").value);
  const link = app.querySelector("#goal-link").value.trim();
  if (!name || !target) return;
  data.goals.push({ id: uid(), name, target, saved, link });
  saveFinance();
  render();
}

function bumpGoal(id, delta) {
  const g = data.goals.find(g => g.id === id);
  if (!g) return;
  g.saved = Math.max(0, g.saved + delta);
  saveFinance();
  render();
}

async function fetchRate(app) {
  const noteEl = app.querySelector("#rate-note");
  if (noteEl) noteEl.textContent = "Fetching…";
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/USD");
    const json = await res.json();
    if (json.result === "success" && json.rates && json.rates.VND) {
      rate.usdToVnd = json.rates.VND;
      rate.updatedAt = Date.now();
      localStorage.setItem("finance-usd-vnd-rate", JSON.stringify(rate));
    } else {
      throw new Error("bad response");
    }
  } catch (e) {
    const cached = localStorage.getItem("finance-usd-vnd-rate");
    if (cached) rate = JSON.parse(cached);
  }
  render();
}

function convertHtml() {
  const rateKnown = !!rate.usdToVnd;
  const updatedStr = rate.updatedAt ? new Date(rate.updatedAt).toLocaleString() : "never";
  const eff = effectiveRate();
  return `
    <p class="eyebrow">USD &harr; VND</p>
    <div class="converter">
      <div class="converter-row"><span>USD</span><input type="number" id="conv-usd" placeholder="0" ${rateKnown ? "" : "disabled"} /></div>
      <div class="converter-row"><span>VND</span><input type="number" id="conv-vnd" placeholder="0" ${rateKnown ? "" : "disabled"} /></div>
    </div>
    <div class="converter-rate">
      <label style="display:flex; align-items:center; gap:6px;">+ VAT/card fee <input type="number" id="conv-markup" value="${markupPct}" step="0.1" style="width:52px; font-family:var(--font-mono); font-size:var(--fs-2xs); border:1px solid var(--border); border-radius:2px; padding:3px 5px; background:var(--paper);" />%</label>
      <button id="refresh-rate-btn" type="button">refresh</button>
    </div>
    <div class="converter-rate" style="margin-top:4px;">
      <span id="rate-note">${rateKnown ? `1 USD = ${fmtVnd(eff)} effective (spot ${fmtVnd(rate.usdToVnd)}) · ${updatedStr}` : "Rate unavailable — check connection"}</span>
    </div>
    <div class="converter-equiv" id="converter-equiv" style="${rateKnown ? "" : "display:none;"}"></div>
  `;
}

function updateEquivalence(vndAmount) {
  const equivEl = document.getElementById("converter-equiv");
  if (!equivEl || !vndAmount || vndAmount <= 0) { if (equivEl) equivEl.innerHTML = ""; return; }
  const days = (vndAmount / AVG_DAILY_FOOD_COST_VND).toFixed(1);
  const eggs = Math.floor(vndAmount / EGG_COST_VND);
  const thmMonthlyVnd = rate.usdToVnd ? TRYHACKME_MONTHLY_USD * rate.usdToVnd : null;
  const thmPct = thmMonthlyVnd ? ((vndAmount / thmMonthlyVnd) * 100).toFixed(0) : null;
  equivEl.innerHTML = `
    <p style="margin:0 0 6px; font-weight:700;">That's roughly:</p>
    <ul style="margin:0; padding-left:18px;">
      <li>${days} day${days == 1 ? "" : "s"} of food budget (~${fmtBoth(AVG_DAILY_FOOD_COST_VND)}/day)</li>
      <li>${eggs} eggs (${fmtBoth(EGG_COST_VND)} each)</li>
      ${thmPct ? `<li>${thmPct}% of a TryHackMe monthly sub ($${TRYHACKME_MONTHLY_USD})</li>` : ""}
    </ul>
  `;
}

function render() {
  const app = document.getElementById("app");
  if (!loaded) { app.innerHTML = '<p class="eyebrow">Loading…</p>'; return; }

  const incomeTotal = monthTotal(data.income);
  const expenseTotal = monthTotal(data.expenses);
  const net = incomeTotal - expenseTotal;
  const goalTotalTarget = data.goals.reduce((s, g) => s + g.target, 0);
  const goalTotalSaved = data.goals.reduce((s, g) => s + g.saved, 0);
  const subTotal = data.subscriptions.reduce((s, sub) => s + sub.amount, 0);
  const totalBalanceVnd = totalBalance(data);

  const accountsHtml = data.accounts.length ? data.accounts.map(a => {
    const bal = accountBalance(data, a.id);
    return `
      <div class="budget-row">
        <div class="budget-top">
          <span class="budget-name">${escapeHtml(a.name)}</span>
          <span class="budget-amounts ${bal < 0 ? "over" : ""}">${fmtBoth(bal)}</span>
        </div>
        <button class="row-del" data-del="accounts" data-id="${a.id}" type="button">&times;</button>
      </div>
    `;
  }).join("") : `<p class="rows-empty">No accounts yet — add one below (Card, Cash, Bank...).</p>`;

  const subsHtml = data.subscriptions.length ? data.subscriptions.map(sub => {
    const ended = sub.endMonth && currentMonthKey() > sub.endMonth;
    const endLabel = sub.endMonth ? `ends ${new Date(sub.endMonth + "-01").toLocaleString("en-US", { month: "short", year: "numeric" })}` : "";
    let statusLabel;
    if (ended) statusLabel = "ended";
    else if (sub.lastLoggedMonth === currentMonthKey()) statusLabel = "logged this month";
    else statusLabel = "logs next visit";
    return `
    <div class="budget-row">
      <div class="budget-top">
        <span class="budget-name">${escapeHtml(sub.name)}${sub.link ? ` <a href="${escapeHtml(sub.link)}" target="_blank" rel="noopener" title="${escapeHtml(sub.link)}">&#8599;</a>` : ""}${ended ? " (ended)" : ""}</span>
        <span class="budget-amounts">${fmtBoth(sub.amount)}/mo &middot; ${accountName(data, sub.account)}${sub.dueDay ? ` &middot; due day ${sub.dueDay}` : ""}${endLabel ? ` &middot; ${endLabel}` : ""}</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <select class="cat-edit" data-cat-edit="subscriptions" data-id="${sub.id}">${CATEGORIES.map(c => `<option value="${c.key}" ${c.key === sub.category ? "selected" : ""}>${c.label}</option>`).join("")}</select>
        <span style="font-size:var(--fs-2xs); color:var(--ink-soft);">${statusLabel}</span>
        <button class="row-del" data-del="subscriptions" data-id="${sub.id}" type="button" style="margin-left:auto;">&times;</button>
      </div>
    </div>
  `;
  }).join("") : `<p class="rows-empty">No recurring fees yet — add one below (Claude Pro, TryHackMe, etc).</p>`;

  const incomeRows = [...data.income].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 15);
  const incomeHtml = incomeRows.length ? `
    <div class="table-scroll"><table class="rows-table">
      <thead><tr><th>Date</th><th>Source</th><th>Account</th><th>Amount</th><th></th></tr></thead>
      <tbody>
        ${incomeRows.map(e => `<tr><td>${e.date}</td><td>${escapeHtml(e.source)}</td><td>${accountName(data, e.account)}</td><td class="num">${fmtBoth(e.amount)}</td><td><button class="row-del" data-del="income" data-id="${e.id}" type="button">&times;</button></td></tr>`).join("")}
      </tbody>
    </table></div>
  ` : `<p class="rows-empty">No income logged yet.</p>`;

  const expenseRows = [...data.expenses].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20);
  const expenseHtml = expenseRows.length ? `
    <div class="table-scroll"><table class="rows-table">
      <thead><tr><th>Date</th><th>Category</th><th>Account</th><th>Note</th><th>Amount</th><th></th></tr></thead>
      <tbody>
        ${expenseRows.map(e => `<tr data-cat style="--cat-color:${CAT_COLOR[e.category] || "var(--ink-soft)"}"><td>${e.date}</td><td><select class="cat-edit" data-cat-edit="expenses" data-id="${e.id}">${CATEGORIES.map(c => `<option value="${c.key}" ${c.key === e.category ? "selected" : ""}>${c.label}</option>`).join("")}</select></td><td>${accountName(data, e.account)}</td><td>${escapeHtml(e.note || "")}${e.link ? ` <a href="${escapeHtml(e.link)}" target="_blank" rel="noopener" title="${escapeHtml(e.link)}">&#8599;</a>` : ""}</td><td class="num">${fmtBoth(e.amount)}</td><td><button class="row-del" data-del="expenses" data-id="${e.id}" type="button">&times;</button></td></tr>`).join("")}
      </tbody>
    </table></div>
  ` : `<p class="rows-empty">No expenses logged yet.</p>`;

  const budgetHtml = CATEGORIES.map(c => {
    const spent = categoryMonthTotal(c.key);
    const budget = data.budgets[c.key] || 0;
    const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
    const over = budget > 0 && spent > budget;
    return `
      <div class="budget-row">
        <div class="budget-top">
          <span class="budget-name">${c.label}</span>
          <span class="budget-amounts ${over ? "over" : ""}">${fmtBoth(spent)} ${budget ? `/ ${fmtBoth(budget)}` : "(no budget set)"}</span>
        </div>
        <div class="budget-bar-track"><div class="budget-bar-fill ${over ? "over" : ""}" style="width:${pct}%; background:${over ? "var(--danger)" : c.color};"></div></div>
        <div class="budget-edit">
          <label style="font-size:var(--fs-2xs); color:var(--ink-soft);">Monthly budget</label>
          <input type="text" inputmode="numeric" data-budget-cat="${c.key}" value="${budget || ""}" placeholder="0" />
        </div>
      </div>
    `;
  }).join("");

  const goalsHtml = data.goals.length ? data.goals.map(g => {
    const pct = g.target > 0 ? Math.min(100, (g.saved / g.target) * 100) : 0;
    return `
      <div class="goal-card">
        <div class="goal-top">
          <span class="goal-name">${escapeHtml(g.name)}${g.link ? ` <a href="${escapeHtml(g.link)}" target="_blank" rel="noopener" title="${escapeHtml(g.link)}">&#8599;</a>` : ""}</span>
          <span class="goal-pct">${pct.toFixed(0)}%</span>
        </div>
        <div class="goal-amounts" style="margin-bottom:6px;">${fmtBoth(g.saved)} / ${fmtBoth(g.target)}</div>
        <div class="budget-bar-track" style="margin-bottom:8px;"><div class="budget-bar-fill" style="width:${pct}%;"></div></div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost btn-small" data-goal-bump="${g.id}" data-delta="100000" type="button">+100k VND</button>
          <button class="btn btn-ghost btn-small" data-goal-bump="${g.id}" data-delta="-100000" type="button">-100k VND</button>
          <button class="row-del" data-del="goals" data-id="${g.id}" type="button" style="margin-left:auto;">&times;</button>
        </div>
      </div>
    `;
  }).join("") : `<p class="rows-empty">No savings goals yet — add one below (e.g. TryHackMe sub, Security+ voucher).</p>`;

  app.innerHTML = `
    <p class="eyebrow">Finance</p>
    <h1>Money, planned out</h1>
    <p class="subtitle">Budget by category, log spend, track savings goals, and check what your money is worth in VND or USD.</p>

    <div class="layout">
      <div class="col-main">

        <section class="card">
          <div class="stats-grid">
            <div class="stat"><p class="stat-label">Income this month</p><p class="stat-value good">${fmtVnd(incomeTotal)}</p><p class="stat-value small">${fmtUsd(incomeTotal)}</p></div>
            <div class="stat"><p class="stat-label">Spent this month</p><p class="stat-value">${fmtVnd(expenseTotal)}</p><p class="stat-value small">${fmtUsd(expenseTotal)}</p></div>
            <div class="stat"><p class="stat-label">Net</p><p class="stat-value ${net >= 0 ? "good" : "bad"}">${net >= 0 ? "+" : ""}${fmtVnd(net)}</p><p class="stat-value small">${net >= 0 ? "+" : ""}${fmtUsd(net)}</p></div>
            <div class="stat"><p class="stat-label">Goals saved</p><p class="stat-value small">${fmtBoth(goalTotalSaved)} / ${fmtBoth(goalTotalTarget)}</p></div>
            <div class="stat"><p class="stat-label">Recurring / mo</p><p class="stat-value small">${fmtBoth(subTotal)}</p></div>
            <div class="stat"><p class="stat-label">Total balance</p><p class="stat-value ${totalBalanceVnd >= 0 ? "good" : "bad"}">${fmtVnd(totalBalanceVnd)}</p><p class="stat-value small">${fmtUsd(totalBalanceVnd)}</p></div>
          </div>
        </section>

        ${calendarHtml()}

        <section class="card card-hero" id="log-expense">
          <h2>Log expense</h2>
          <div class="log-form">
            <div class="log-field"><label for="exp-date">Date</label><input type="date" id="exp-date" value="${todayDateStr()}" /></div>
            <div class="log-field"><label for="exp-category">Category</label>
              <select id="exp-category">${CATEGORIES.map(c => `<option value="${c.key}">${c.label}</option>`).join("")}</select>
            </div>
            <div class="log-field"><label for="exp-account">From account</label><select id="exp-account">${accountOptionsHtml()}</select></div>
            <div class="log-field amount"><label for="exp-amount">Amount (VND)</label><input type="text" inputmode="numeric" id="exp-amount" placeholder="0" /></div>
            <div class="log-field wide"><label for="exp-note">Note</label><input type="text" id="exp-note" placeholder="optional" /></div>
            <div class="log-field wide"><label for="exp-link">Link (optional, e.g. a digital service)</label><input type="url" id="exp-link" placeholder="https://..." /></div>
          </div>
          <div class="log-save-row"><button class="btn" id="add-expense-btn" type="button">Add expense</button></div>
          <p class="eyebrow" style="margin-bottom:10px;">Recent expenses</p>
          ${expenseHtml}
        </section>

        <section class="card card-hero">
          <h2>Log income</h2>
          <div class="log-form">
            <div class="log-field"><label for="inc-date">Date</label><input type="date" id="inc-date" value="${todayDateStr()}" /></div>
            <div class="log-field"><label for="inc-source">Source</label><input type="text" id="inc-source" placeholder="Salary, freelance..." /></div>
            <div class="log-field"><label for="inc-account">Into account</label><select id="inc-account">${accountOptionsHtml()}</select></div>
            <div class="log-field amount"><label for="inc-amount">Amount (VND)</label><input type="text" inputmode="numeric" id="inc-amount" placeholder="0" /></div>
          </div>
          <div class="log-save-row"><button class="btn" id="add-income-btn" type="button">Add income</button></div>
          <p class="eyebrow" style="margin-bottom:10px;">Recent income</p>
          ${incomeHtml}
        </section>

        <section class="card">
          <h2>Savings goals</h2>
          ${goalsHtml}
          <p class="eyebrow" style="margin:20px 0 10px;">Add a goal</p>
          <div class="log-form">
            <div class="log-field wide"><label for="goal-name">Name</label><input type="text" id="goal-name" placeholder="e.g. Security+ Voucher" /></div>
            <div class="log-field"><label for="goal-target-usd">Target (USD)</label><input type="number" id="goal-target-usd" placeholder="optional" /></div>
            <div class="log-field"><label for="goal-target">Target (VND)</label><input type="text" inputmode="numeric" id="goal-target" placeholder="0" /></div>
            <div class="log-field"><label for="goal-saved">Saved (VND)</label><input type="text" inputmode="numeric" id="goal-saved" placeholder="0" /></div>
            <div class="log-field wide"><label for="goal-link">Link (optional, e.g. a digital service)</label><input type="url" id="goal-link" placeholder="https://..." /></div>
          </div>
          <div class="log-save-row"><button class="btn" id="add-goal-btn" type="button">Add goal</button></div>
        </section>

        <section class="card">
          <h2>Accounts</h2>
          <p class="subtitle" style="margin-bottom:12px;">Where the money actually sits (Card, Cash, Bank...). Balance = starting balance + income tagged to it − expenses tagged to it.</p>
          ${accountsHtml}
          <p class="eyebrow" style="margin:20px 0 10px;">Add an account</p>
          <div class="log-form">
            <div class="log-field"><label for="acc-name">Name</label><input type="text" id="acc-name" placeholder="e.g. Cash, Vietcombank Card" /></div>
            <div class="log-field"><label for="acc-start">Starting balance (VND)</label><input type="text" inputmode="numeric" id="acc-start" placeholder="0" /></div>
          </div>
          <div class="log-save-row"><button class="btn" id="add-account-btn" type="button">Add account</button></div>
        </section>

        <section class="card">
          <h2>Budget by category</h2>
          <p class="subtitle" style="margin-bottom:12px;">Set a monthly ceiling per category, see what's actually spent this month.</p>
          ${budgetHtml}
        </section>

        <section class="card">
          <h2>Recurring subscriptions</h2>
          <p class="subtitle" style="margin-bottom:12px;">Fixed monthly fees (Claude Pro, TryHackMe, etc). Each auto-logs itself as an expense the first time you open this page in a new month.</p>
          ${subsHtml}
          <p class="eyebrow" style="margin:20px 0 10px;">Add a subscription</p>
          <div class="log-form">
            <div class="log-field"><label for="sub-name">Name</label><input type="text" id="sub-name" placeholder="e.g. Claude Pro" /></div>
            <div class="log-field"><label for="sub-category">Category</label>
              <select id="sub-category">${CATEGORIES.map(c => `<option value="${c.key}">${c.label}</option>`).join("")}</select>
            </div>
            <div class="log-field"><label for="sub-account">Account</label><select id="sub-account">${accountOptionsHtml()}</select></div>
            <div class="log-field"><label for="sub-amount">Amount (VND/mo)</label><input type="text" inputmode="numeric" id="sub-amount" placeholder="0" /></div>
            <div class="log-field"><label for="sub-dueday">Due day (1-31)</label><input type="number" id="sub-dueday" placeholder="optional" min="1" max="31" /></div>
            <div class="log-field"><label for="sub-end">Ends after (optional)</label><input type="month" id="sub-end" /></div>
          </div>
          <div class="log-form">
            <div class="log-field wide"><label for="sub-link">Link (optional, e.g. the service's site)</label><input type="url" id="sub-link" placeholder="https://..." /></div>
          </div>
          <p class="eyebrow" style="margin:20px 0 10px;">Or split a total over N months (e.g. paying off a loan)</p>
          <div class="log-form">
            <div class="log-field"><label for="sub-total">Total to pay off (VND)</label><input type="text" inputmode="numeric" id="sub-total" placeholder="e.g. 6,000,000" /></div>
            <div class="log-field"><label for="sub-months">Over how many months</label><input type="number" id="sub-months" placeholder="e.g. 6" min="1" /></div>
          </div>
          <div class="log-save-row"><button class="btn" id="add-sub-btn" type="button">Add subscription</button></div>
        </section>

        <p class="footer">Amounts stored in VND. USD figures elsewhere on the site convert using the rate in the sidebar.</p>
      </div>

      <div class="col-side">
        ${convertHtml()}
      </div>
    </div>
  `;

  app.querySelector("#add-income-btn").addEventListener("click", () => addIncome(app));
  app.querySelector("#add-expense-btn").addEventListener("click", () => addExpense(app));
  app.querySelector("#add-goal-btn").addEventListener("click", () => addGoal(app));
  app.querySelector("#add-sub-btn").addEventListener("click", () => addSubscription(app));
  app.querySelector("#add-account-btn").addEventListener("click", () => addAccount(app));
  app.querySelector("#cal-prev").addEventListener("click", () => shiftCalendar(-1));
  app.querySelector("#cal-next").addEventListener("click", () => shiftCalendar(1));
  const subTotalInput = app.querySelector("#sub-total");
  const subMonthsInput = app.querySelector("#sub-months");
  const subAmountInput = app.querySelector("#sub-amount");
  const subEndInput = app.querySelector("#sub-end");
  const recalcInstallment = () => {
    const total = parseAmount(subTotalInput.value);
    const months = Number(subMonthsInput.value);
    if (total > 0 && months > 0) {
      subAmountInput.value = Math.round(total / months).toLocaleString();
      const d = new Date();
      d.setMonth(d.getMonth() + months - 1);
      subEndInput.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }
  };
  subTotalInput.addEventListener("input", recalcInstallment);
  subMonthsInput.addEventListener("input", recalcInstallment);
  ["exp-amount", "inc-amount", "acc-start", "goal-target", "goal-saved", "sub-amount", "sub-total"].forEach(id => {
    const el = app.querySelector(`#${id}`);
    if (el) attachThousandsInput(el);
  });
  app.querySelectorAll("[data-budget-cat]").forEach(attachThousandsInput);
  app.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", () => removeEntry(btn.dataset.del, btn.dataset.id));
  });
  app.querySelectorAll("[data-goal-bump]").forEach(btn => {
    btn.addEventListener("click", () => bumpGoal(btn.dataset.goalBump, Number(btn.dataset.delta)));
  });
  app.querySelectorAll("[data-budget-cat]").forEach(input => {
    input.addEventListener("change", () => setBudget(input.dataset.budgetCat, input.value));
  });
  app.querySelectorAll("[data-cat-edit]").forEach(sel => {
    sel.addEventListener("change", () => setEntryCategory(sel.dataset.catEdit, sel.dataset.id, sel.value));
  });

  const usdInput = app.querySelector("#conv-usd");
  const vndInput = app.querySelector("#conv-vnd");
  if (usdInput && vndInput && rate.usdToVnd) {
    usdInput.addEventListener("input", () => {
      const usd = Number(usdInput.value) || 0;
      const vnd = usd * effectiveRate();
      vndInput.value = usd ? Math.round(vnd) : "";
      updateEquivalence(vnd);
    });
    vndInput.addEventListener("input", () => {
      const vnd = Number(vndInput.value) || 0;
      const usd = vnd / effectiveRate();
      usdInput.value = vnd ? usd.toFixed(2) : "";
      updateEquivalence(vnd);
    });
  }
  const refreshBtn = app.querySelector("#refresh-rate-btn");
  if (refreshBtn) refreshBtn.addEventListener("click", () => fetchRate(app));
  const markupInput = app.querySelector("#conv-markup");
  if (markupInput) markupInput.addEventListener("change", () => {
    markupPct = Number(markupInput.value) || 0;
    localStorage.setItem("finance-usd-markup", markupPct);
    render();
  });
  const goalUsdInput = app.querySelector("#goal-target-usd");
  const goalVndInput = app.querySelector("#goal-target");
  if (goalUsdInput && goalVndInput && rate.usdToVnd) {
    goalUsdInput.addEventListener("input", () => {
      const usd = Number(goalUsdInput.value) || 0;
      goalVndInput.value = usd ? Math.round(usd * effectiveRate()).toLocaleString() : "";
    });
  }

  if (!handledHash && location.hash === "#log-expense") {
    handledHash = true;
    requestAnimationFrame(() => {
      const section = document.getElementById("log-expense");
      if (section) section.scrollIntoView({ behavior: "smooth", block: "start" });
      const amt = document.getElementById("exp-amount");
      if (amt) amt.focus();
    });
  }
}

initAuthUI({
  onSignedIn: () => {
    if (!loaded) {
      const cached = localStorage.getItem("finance-usd-vnd-rate");
      if (cached) rate = JSON.parse(cached);
      loadFinance().then(() => fetchRate(document.getElementById("app")));
    }
  },
  onSignedOut: () => { loaded = false; }
});
</script>
<script src="./pwa-init.js"></script>
</body>
</html>
