<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2ECDD; --paper-deep: #E7DCC3; --ink: #211E1A; --ink-soft: #6E6455;
    --vermillion: #9E3A26; --gold: #806124; --border: rgba(33,30,26,0.14); --danger: #8A2F20;
    --cat-work: #2E4A66; --cat-study: #806124; --cat-fitness: #9E3A26; --cat-life: #52603E;
    --font: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace;
    --font-display: 'Shippori Mincho', Georgia, serif;
    --fs-2xs: clamp(12.5px, 0.85vw, 14.5px);
    --fs-xs: clamp(13.5px, 0.95vw, 15.5px);
    --fs-sm: clamp(14.5px, 1.05vw, 17px);
    --fs-base: clamp(15.5px, 1.15vw, 18px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body {
    padding: 24px 20px 60px; position: relative; animation: page-in 0.35s ease-out;
    background-image: radial-gradient(ellipse 60% 50% at 10% 5%, rgba(33,30,26,0.035), transparent 60%);
  }
  @keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .koi-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.07;
    background-image: url('./assets/koi.jpg'); background-repeat: no-repeat;
    animation: koi-sway 10s ease-in-out infinite; transform-origin: center;
  }
  @keyframes koi-sway { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(0.4deg) scale(1.02); } }
  @media (orientation: portrait) { .koi-bg { background-size: auto 78vh; background-position: center center; } }
  @media (orientation: landscape) { .koi-bg { background-size: auto 92vh; background-position: bottom right; } }
  @media (max-width: 780px) { .koi-bg { opacity: 0.05; } }

  nav.top, .auth-gate, .signed-in-as, .shell { position: relative; z-index: 1; }

  .shell { max-width: clamp(960px, 76vw, 1880px); margin: 0 auto; }
  nav.top { max-width: clamp(960px, 76vw, 1880px); margin: 0 auto 24px; display: flex; gap: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  nav.top a { color: var(--ink-soft); text-decoration: none; font-size: clamp(13px, 0.75vw, 16px); font-weight: 700; background-image: linear-gradient(var(--vermillion), var(--vermillion)); background-size: 0% 2px; background-repeat: no-repeat; background-position: left bottom; padding-bottom: 3px; transition: background-size 0.2s ease, color 0.15s ease; }
  nav.top a:hover { color: var(--ink); background-size: 100% 2px; }
  nav.top a.current { color: var(--vermillion); }

  .eyebrow { font-size: clamp(12px, 0.65vw, 15px); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--vermillion); margin: 0 0 8px; }
  h1 { font-family: var(--font-display); font-size: clamp(24px, 1.7vw, 34px); line-height: 1.2; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-family: var(--font-display); font-size: clamp(19px, 1.2vw, 24px); font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--ink-soft); font-size: var(--fs-sm); line-height: 1.6; margin: 0 0 24px; max-width: 62ch; }

  .auth-gate { max-width: 380px; margin: 80px auto; text-align: center; }
  .auth-gate .subtitle { margin: 0 0 22px; }
  .btn {
    font-family: var(--font); font-weight: 700; font-size: 14px; border-radius: 2px;
    border: none; background: var(--vermillion); color: var(--paper);
    padding: 10px 18px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity 0.1s ease, transform 0.1s ease;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 2px; }
  .btn-ghost { background: transparent; color: var(--vermillion); border: 1px solid var(--vermillion); }
  .btn-small { font-size: var(--fs-2xs); padding: 6px 12px; min-height: 32px; }
  .auth-error { color: var(--danger); font-size: var(--fs-sm); margin-top: 14px; }
  .signed-in-as { font-size: var(--fs-xs); color: var(--ink-soft); text-align: right; max-width: 600px; margin: 0 auto 14px; }
  .signed-in-as button { background: none; border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-family: var(--font); font-size: var(--fs-xs); padding: 0 0 0 10px; }
  .signed-in-as button:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 1fr minmax(240px, clamp(300px, 22vw, 400px)); gap: clamp(56px, 4.5vw, 110px); align-items: start; }
  .col-side { position: sticky; top: 24px; background: var(--paper-deep); border: 1px solid var(--border); border-radius: 2px; padding: 22px 24px; }
  .col-main { min-width: 0; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; gap: 20px; } .col-side { position: static; order: -1; } }

  section.card { margin-bottom: 44px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 26px; }
  .stat { background: var(--paper); padding: 14px 16px; }
  .stat-label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin: 0 0 4px; }
  .stat-value { font-family: var(--font-display); font-size: clamp(18px, 1.3vw, 24px); font-weight: 600; color: var(--vermillion); }
  .stat-value.small { font-size: clamp(15px, 1vw, 18px); }
  .stat-value.good { color: var(--cat-life); }
  .stat-value.bad { color: var(--danger); }

  .log-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .log-field { display: flex; flex-direction: column; gap: 5px; }
  .log-field.wide { grid-column: 1 / -1; }
  .log-field label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .log-field input[type="number"], .log-field input[type="text"], .log-field input[type="date"], .log-field select {
    font-family: var(--font); font-size: var(--fs-base); color: var(--ink); background: var(--paper);
    border: 1px solid var(--border); border-radius: 2px; padding: 9px 10px; width: 100%;
  }
  .log-field input:focus-visible, .log-field select:focus-visible { outline: 2px solid var(--vermillion); outline-offset: 1px; }
  .log-save-row { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .log-saved-note { font-size: var(--fs-xs); color: var(--ink-soft); }

  .rows-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); margin-bottom: 12px; }
  .rows-table th, .rows-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .rows-table th { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); font-weight: 600; }
  .rows-table td.num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
  .rows-table tr[data-cat] td:first-child { border-left: 3px solid var(--cat-color, var(--cat-life)); padding-left: 8px; }
  .row-del { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; }
  .row-del:hover { color: var(--danger); }
  .rows-empty { font-size: var(--fs-sm); color: var(--ink-soft); font-style: italic; margin: 0 0 12px; }

  .budget-row { padding: 12px 2px; border-top: 1px solid var(--border); }
  .budget-row:first-child { border-top: none; }
  .budget-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .budget-name { font-weight: 600; font-size: var(--fs-base); }
  .budget-amounts { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-soft); }
  .budget-amounts.over { color: var(--danger); font-weight: 700; }
  .budget-bar-track { height: 8px; background: var(--paper); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .budget-bar-fill { height: 100%; background: var(--cat-life); transition: width 0.2s ease; }
  .budget-bar-fill.over { background: var(--danger); }
  .budget-edit { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .budget-edit input { width: 110px; font-family: var(--font); font-size: var(--fs-xs); color: var(--ink); background: var(--paper); border: 1px solid var(--border); border-radius: 2px; padding: 5px 8px; }

  .goal-card { padding: 16px 2px; border-top: 1px solid var(--border); }
  .goal-card:first-child { border-top: none; }
  .goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .goal-name { font-weight: 600; font-size: var(--fs-base); }
  .goal-amounts { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-soft); }
  .goal-pct { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--vermillion); font-weight: 700; }

  .converter { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .converter-row { display: flex; align-items: center; gap: 10px; }
  .converter-row input { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: var(--fs-base); color: var(--ink); background: var(--paper); border: 1px solid var(--border); border-radius: 2px; padding: 9px 10px; }
  .converter-row span { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-soft); width: 42px; flex-shrink: 0; }
  .converter-rate { font-size: var(--fs-2xs); color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .converter-rate button { background: none; border: none; color: var(--vermillion); cursor: pointer; font-size: var(--fs-2xs); text-decoration: underline; padding: 0; }
  .converter-equiv { font-size: var(--fs-xs); color: var(--ink); line-height: 1.6; margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--border); }
  .converter-equiv li { margin: 0 0 4px; }

  .footer { margin-top: 20px; font-size: clamp(12.5px, 0.7vw, 15px); color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="koi-bg" aria-hidden="true"></div>

  <nav class="top"><a href="./index.html">Home</a><a href="./schedule.html">Schedule</a><a href="./roadmap.html">Roadmap</a><a href="./health.html">Health</a><a href="./finance.html" class="current">Finance</a></nav>

  <p class="eyebrow" id="boot-loading" style="text-align:center; margin-top:60px;">Loading…</p>

  <div class="auth-gate" id="auth-gate" style="display:none;">
    <p class="eyebrow">Sign in</p>
    <h1>One tap to sync</h1>
    <p class="subtitle">Sign in with the same Google account on every device and this stays in sync automatically.</p>
    <button class="btn" id="signin-btn">Sign in with Google</button>
    <p class="auth-error" id="auth-error" style="display:none;"></p>
  </div>

  <p class="signed-in-as" id="signed-in-as" style="display:none;"></p>
  <div class="shell" id="app" style="display:none;">
    <p class="eyebrow">Loading…</p>
  </div>

<script type="module">
import { signIn, signOutUser, watchAuth, loadData, saveData } from "./firebase-init.js";

const STORAGE_KEY = "finance-data";
const CATEGORIES = [
  { key: "food", label: "Food", color: "var(--cat-life)" },
  { key: "study", label: "Study / Certs", color: "var(--cat-study)" },
  { key: "transport", label: "Transport", color: "var(--cat-work)" },
  { key: "bills", label: "Bills", color: "var(--cat-work)" },
  { key: "fun", label: "Fun", color: "var(--cat-fitness)" },
  { key: "other", label: "Other", color: "var(--ink-soft)" }
];
const CAT_LABEL = Object.fromEntries(CATEGORIES.map(c => [c.key, c.label]));
const CAT_COLOR = Object.fromEntries(CATEGORIES.map(c => [c.key, c.color]));

const AVG_DAILY_FOOD_COST_VND = 72000;
const EGG_COST_VND = 3200;
const TRYHACKME_MONTHLY_USD = 14;

let data = { income: [], expenses: [], budgets: {}, goals: [] };
let loaded = false;
let rate = { usdToVnd: null, updatedAt: null };

function todayDateStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function currentMonthKey() { return todayDateStr().slice(0, 7); }
function fmtVnd(n) { return Math.round(n).toLocaleString() + "₫"; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

async function loadFinance() {
  try {
    const value = await loadData(STORAGE_KEY);
    if (value) data = { income: [], expenses: [], budgets: {}, goals: [], ...value };
  } catch (e) {
    data = { income: [], expenses: [], budgets: {}, goals: [] };
  }
  loaded = true;
  render();
}

async function saveFinance() {
  await saveData(STORAGE_KEY, data);
}

function monthTotal(list) {
  const mk = currentMonthKey();
  return list.filter(e => e.date && e.date.startsWith(mk)).reduce((sum, e) => sum + Number(e.amount || 0), 0);
}

function categoryMonthTotal(catKey) {
  const mk = currentMonthKey();
  return data.expenses.filter(e => e.date && e.date.startsWith(mk) && e.category === catKey).reduce((sum, e) => sum + Number(e.amount || 0), 0);
}

function addIncome(app) {
  const date = app.querySelector("#inc-date").value || todayDateStr();
  const source = app.querySelector("#inc-source").value.trim();
  const amount = Number(app.querySelector("#inc-amount").value);
  if (!amount) return;
  data.income.push({ id: uid(), date, source: source || "Income", amount });
  saveFinance();
  render();
}

function addExpense(app) {
  const date = app.querySelector("#exp-date").value || todayDateStr();
  const category = app.querySelector("#exp-category").value;
  const amount = Number(app.querySelector("#exp-amount").value);
  const note = app.querySelector("#exp-note").value.trim();
  if (!amount) return;
  data.expenses.push({ id: uid(), date, category, amount, note });
  saveFinance();
  render();
}

function removeEntry(list, id) {
  data[list] = data[list].filter(e => e.id !== id);
  saveFinance();
  render();
}

function setBudget(catKey, value) {
  data.budgets[catKey] = Number(value) || 0;
  saveFinance();
  render();
}

function addGoal(app) {
  const name = app.querySelector("#goal-name").value.trim();
  const target = Number(app.querySelector("#goal-target").value);
  const saved = Number(app.querySelector("#goal-saved").value) || 0;
  if (!name || !target) return;
  data.goals.push({ id: uid(), name, target, saved });
  saveFinance();
  render();
}

function bumpGoal(id, delta) {
  const g = data.goals.find(g => g.id === id);
  if (!g) return;
  g.saved = Math.max(0, g.saved + delta);
  saveFinance();
  render();
}

async function fetchRate(app) {
  const noteEl = app.querySelector("#rate-note");
  if (noteEl) noteEl.textContent = "Fetching…";
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/USD");
    const json = await res.json();
    if (json.result === "success" && json.rates && json.rates.VND) {
      rate.usdToVnd = json.rates.VND;
      rate.updatedAt = Date.now();
      localStorage.setItem("finance-usd-vnd-rate", JSON.stringify(rate));
    } else {
      throw new Error("bad response");
    }
  } catch (e) {
    const cached = localStorage.getItem("finance-usd-vnd-rate");
    if (cached) rate = JSON.parse(cached);
  }
  render();
}

function convertHtml() {
  const rateKnown = !!rate.usdToVnd;
  const updatedStr = rate.updatedAt ? new Date(rate.updatedAt).toLocaleString() : "never";
  return `
    <p class="eyebrow">USD &harr; VND</p>
    <div class="converter">
      <div class="converter-row"><span>USD</span><input type="number" id="conv-usd" placeholder="0" ${rateKnown ? "" : "disabled"} /></div>
      <div class="converter-row"><span>VND</span><input type="number" id="conv-vnd" placeholder="0" ${rateKnown ? "" : "disabled"} /></div>
    </div>
    <div class="converter-rate">
      <span id="rate-note">${rateKnown ? `1 USD = ${fmtVnd(rate.usdToVnd)} · ${updatedStr}` : "Rate unavailable — check connection"}</span>
      <button id="refresh-rate-btn" type="button">refresh</button>
    </div>
    <div class="converter-equiv" id="converter-equiv" style="${rateKnown ? "" : "display:none;"}"></div>
  `;
}

function updateEquivalence(vndAmount) {
  const equivEl = document.getElementById("converter-equiv");
  if (!equivEl || !vndAmount || vndAmount <= 0) { if (equivEl) equivEl.innerHTML = ""; return; }
  const days = (vndAmount / AVG_DAILY_FOOD_COST_VND).toFixed(1);
  const eggs = Math.floor(vndAmount / EGG_COST_VND);
  const thmMonthlyVnd = rate.usdToVnd ? TRYHACKME_MONTHLY_USD * rate.usdToVnd : null;
  const thmPct = thmMonthlyVnd ? ((vndAmount / thmMonthlyVnd) * 100).toFixed(0) : null;
  equivEl.innerHTML = `
    <p style="margin:0 0 6px; font-weight:700;">That's roughly:</p>
    <ul style="margin:0; padding-left:18px;">
      <li>${days} day${days == 1 ? "" : "s"} of food budget (~${fmtVnd(AVG_DAILY_FOOD_COST_VND)}/day)</li>
      <li>${eggs} eggs (${fmtVnd(EGG_COST_VND)} each)</li>
      ${thmPct ? `<li>${thmPct}% of a TryHackMe monthly sub ($${TRYHACKME_MONTHLY_USD})</li>` : ""}
    </ul>
  `;
}

function render() {
  const app = document.getElementById("app");
  if (!loaded) { app.innerHTML = '<p class="eyebrow">Loading…</p>'; return; }

  const incomeTotal = monthTotal(data.income);
  const expenseTotal = monthTotal(data.expenses);
  const net = incomeTotal - expenseTotal;
  const goalTotalTarget = data.goals.reduce((s, g) => s + g.target, 0);
  const goalTotalSaved = data.goals.reduce((s, g) => s + g.saved, 0);

  const incomeRows = [...data.income].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 15);
  const incomeHtml = incomeRows.length ? `
    <table class="rows-table">
      <thead><tr><th>Date</th><th>Source</th><th>Amount</th><th></th></tr></thead>
      <tbody>
        ${incomeRows.map(e => `<tr><td>${e.date}</td><td>${escapeHtml(e.source)}</td><td class="num">${fmtVnd(e.amount)}</td><td><button class="row-del" data-del="income" data-id="${e.id}" type="button">&times;</button></td></tr>`).join("")}
      </tbody>
    </table>
  ` : `<p class="rows-empty">No income logged yet.</p>`;

  const expenseRows = [...data.expenses].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20);
  const expenseHtml = expenseRows.length ? `
    <table class="rows-table">
      <thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th></th></tr></thead>
      <tbody>
        ${expenseRows.map(e => `<tr data-cat style="--cat-color:${CAT_COLOR[e.category] || "var(--ink-soft)"}"><td>${e.date}</td><td>${CAT_LABEL[e.category] || "Other"}</td><td>${escapeHtml(e.note || "")}</td><td class="num">${fmtVnd(e.amount)}</td><td><button class="row-del" data-del="expenses" data-id="${e.id}" type="button">&times;</button></td></tr>`).join("")}
      </tbody>
    </table>
  ` : `<p class="rows-empty">No expenses logged yet.</p>`;

  const budgetHtml = CATEGORIES.map(c => {
    const spent = categoryMonthTotal(c.key);
    const budget = data.budgets[c.key] || 0;
    const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
    const over = budget > 0 && spent > budget;
    return `
      <div class="budget-row">
        <div class="budget-top">
          <span class="budget-name">${c.label}</span>
          <span class="budget-amounts ${over ? "over" : ""}">${fmtVnd(spent)} ${budget ? `/ ${fmtVnd(budget)}` : "(no budget set)"}</span>
        </div>
        <div class="budget-bar-track"><div class="budget-bar-fill ${over ? "over" : ""}" style="width:${pct}%; background:${over ? "var(--danger)" : c.color};"></div></div>
        <div class="budget-edit">
          <label style="font-size:var(--fs-2xs); color:var(--ink-soft);">Monthly budget</label>
          <input type="number" data-budget-cat="${c.key}" value="${budget || ""}" placeholder="0" />
        </div>
      </div>
    `;
  }).join("");

  const goalsHtml = data.goals.length ? data.goals.map(g => {
    const pct = g.target > 0 ? Math.min(100, (g.saved / g.target) * 100) : 0;
    return `
      <div class="goal-card">
        <div class="goal-top">
          <span class="goal-name">${escapeHtml(g.name)}</span>
          <span class="goal-pct">${pct.toFixed(0)}%</span>
        </div>
        <div class="goal-amounts" style="margin-bottom:6px;">${fmtVnd(g.saved)} / ${fmtVnd(g.target)}</div>
        <div class="budget-bar-track" style="margin-bottom:8px;"><div class="budget-bar-fill" style="width:${pct}%;"></div></div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost btn-small" data-goal-bump="${g.id}" data-delta="100000" type="button">+100k₫</button>
          <button class="btn btn-ghost btn-small" data-goal-bump="${g.id}" data-delta="-100000" type="button">-100k₫</button>
          <button class="row-del" data-del="goals" data-id="${g.id}" type="button" style="margin-left:auto;">&times;</button>
        </div>
      </div>
    `;
  }).join("") : `<p class="rows-empty">No savings goals yet — add one below (e.g. TryHackMe sub, Security+ voucher).</p>`;

  app.innerHTML = `
    <p class="eyebrow">Finance</p>
    <h1>Money, planned out</h1>
    <p class="subtitle">Budget by category, log spend, track savings goals, and check what your money is worth in ₫ or $.</p>

    <div class="layout">
      <div class="col-main">

        <section class="card">
          <div class="stats-grid">
            <div class="stat"><p class="stat-label">Income this month</p><p class="stat-value good">${fmtVnd(incomeTotal)}</p></div>
            <div class="stat"><p class="stat-label">Spent this month</p><p class="stat-value">${fmtVnd(expenseTotal)}</p></div>
            <div class="stat"><p class="stat-label">Net</p><p class="stat-value ${net >= 0 ? "good" : "bad"}">${net >= 0 ? "+" : ""}${fmtVnd(net)}</p></div>
            <div class="stat"><p class="stat-label">Goals saved</p><p class="stat-value small">${fmtVnd(goalTotalSaved)} / ${fmtVnd(goalTotalTarget)}</p></div>
          </div>
        </section>

        <section class="card">
          <h2>Budget by category</h2>
          <p class="subtitle" style="margin-bottom:12px;">Set a monthly ceiling per category, see what's actually spent this month.</p>
          ${budgetHtml}
        </section>

        <section class="card">
          <h2>Log income</h2>
          <div class="log-form">
            <div class="log-field"><label for="inc-date">Date</label><input type="date" id="inc-date" value="${todayDateStr()}" /></div>
            <div class="log-field"><label for="inc-source">Source</label><input type="text" id="inc-source" placeholder="Salary, freelance..." /></div>
            <div class="log-field"><label for="inc-amount">Amount (₫)</label><input type="number" id="inc-amount" placeholder="0" /></div>
          </div>
          <div class="log-save-row"><button class="btn" id="add-income-btn" type="button">Add income</button></div>
          <p class="eyebrow" style="margin-bottom:10px;">Recent income</p>
          ${incomeHtml}
        </section>

        <section class="card">
          <h2>Log expense</h2>
          <div class="log-form">
            <div class="log-field"><label for="exp-date">Date</label><input type="date" id="exp-date" value="${todayDateStr()}" /></div>
            <div class="log-field"><label for="exp-category">Category</label>
              <select id="exp-category">${CATEGORIES.map(c => `<option value="${c.key}">${c.label}</option>`).join("")}</select>
            </div>
            <div class="log-field"><label for="exp-amount">Amount (₫)</label><input type="number" id="exp-amount" placeholder="0" /></div>
            <div class="log-field wide"><label for="exp-note">Note</label><input type="text" id="exp-note" placeholder="optional" /></div>
          </div>
          <div class="log-save-row"><button class="btn" id="add-expense-btn" type="button">Add expense</button></div>
          <p class="eyebrow" style="margin-bottom:10px;">Recent expenses</p>
          ${expenseHtml}
        </section>

        <section class="card">
          <h2>Savings goals</h2>
          ${goalsHtml}
          <p class="eyebrow" style="margin:20px 0 10px;">Add a goal</p>
          <div class="log-form">
            <div class="log-field wide"><label for="goal-name">Name</label><input type="text" id="goal-name" placeholder="e.g. Security+ Voucher" /></div>
            <div class="log-field"><label for="goal-target">Target (₫)</label><input type="number" id="goal-target" placeholder="0" /></div>
            <div class="log-field"><label for="goal-saved">Already saved (₫)</label><input type="number" id="goal-saved" placeholder="0" /></div>
          </div>
          <div class="log-save-row"><button class="btn" id="add-goal-btn" type="button">Add goal</button></div>
        </section>

        <p class="footer">Amounts stored in VND. USD figures elsewhere on the site convert using the rate in the sidebar.</p>
      </div>

      <div class="col-side">
        ${convertHtml()}
      </div>
    </div>
  `;

  app.querySelector("#add-income-btn").addEventListener("click", () => addIncome(app));
  app.querySelector("#add-expense-btn").addEventListener("click", () => addExpense(app));
  app.querySelector("#add-goal-btn").addEventListener("click", () => addGoal(app));
  app.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", () => removeEntry(btn.dataset.del, btn.dataset.id));
  });
  app.querySelectorAll("[data-goal-bump]").forEach(btn => {
    btn.addEventListener("click", () => bumpGoal(btn.dataset.goalBump, Number(btn.dataset.delta)));
  });
  app.querySelectorAll("[data-budget-cat]").forEach(input => {
    input.addEventListener("change", () => setBudget(input.dataset.budgetCat, input.value));
  });

  const usdInput = app.querySelector("#conv-usd");
  const vndInput = app.querySelector("#conv-vnd");
  if (usdInput && vndInput && rate.usdToVnd) {
    usdInput.addEventListener("input", () => {
      const usd = Number(usdInput.value) || 0;
      const vnd = usd * rate.usdToVnd;
      vndInput.value = usd ? Math.round(vnd) : "";
      updateEquivalence(vnd);
    });
    vndInput.addEventListener("input", () => {
      const vnd = Number(vndInput.value) || 0;
      const usd = vnd / rate.usdToVnd;
      usdInput.value = vnd ? usd.toFixed(2) : "";
      updateEquivalence(vnd);
    });
  }
  const refreshBtn = app.querySelector("#refresh-rate-btn");
  if (refreshBtn) refreshBtn.addEventListener("click", () => fetchRate(app));
}

document.getElementById("signin-btn").addEventListener("click", () => {
  const err = document.getElementById("auth-error");
  err.style.display = "none";
  signIn().catch(e => { err.textContent = "Sign-in failed — " + e.message; err.style.display = ""; });
});

watchAuth((user) => {
  document.getElementById("boot-loading").style.display = "none";
  const gate = document.getElementById("auth-gate");
  const app = document.getElementById("app");
  const who = document.getElementById("signed-in-as");
  if (user) {
    gate.style.display = "none";
    app.style.display = "";
    who.style.display = "";
    who.innerHTML = escapeHtml(user.email || user.displayName || "signed in") + '<button id="signout-btn">Sign out</button>';
    document.getElementById("signout-btn").addEventListener("click", () => signOutUser());
    if (!loaded) {
      const cached = localStorage.getItem("finance-usd-vnd-rate");
      if (cached) rate = JSON.parse(cached);
      loadFinance().then(() => fetchRate(document.getElementById("app")));
    }
  } else {
    gate.style.display = "";
    app.style.display = "none";
    who.style.display = "none";
    loaded = false;
  }
});
</script>
</body>
</html>
