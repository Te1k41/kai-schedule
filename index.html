<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Kai's Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10161D; --surface: #171F29; --border: #2A3644;
    --text: #EDEAE2; --text-dim: #93A1AF; --amber: #E8A548; --amber-dim: rgba(232,165,72,0.14); --teal: #4FB090;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  body { padding: 20px 16px 60px; }
  .shell { max-width: 480px; margin: 80px auto 0; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin: 0 0 8px; }
  h1 { font-size: 26px; margin: 0 0 8px; font-weight: 700; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin: 0 0 28px; line-height: 1.5; }
  .card {
    display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 10px; text-decoration: none; color: var(--text);
  }
  .card:hover { border-color: var(--amber); }
  .card-title { font-size: 15.5px; font-weight: 600; margin: 0 0 3px; }
  .card-sub { font-size: 12.5px; color: var(--text-dim); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="shell">
    <p class="eyebrow">Kai // Ops</p>
    <h1>Pick one</h1>
    <p class="subtitle">Synced across every device you sign into with the same Google account.</p>
    <a class="card" href="./schedule.html">
      <p class="card-title">Daily Timetable</p>
      <p class="card-sub">Live "what should I be doing now" view</p>
    </a>
    <a class="card" href="./roadmap.html">
      <p class="card-title">SOC Analyst Roadmap</p>
      <p class="card-sub">35 tasks, 5 phases, zero to job-ready</p>
    </a>
  </div>
</body>
</html>
